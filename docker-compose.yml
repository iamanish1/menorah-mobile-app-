# ── Menorah Health — local development stack ──────────────────────────────
# Usage:
#   docker compose up          → start everything
#   docker compose up --build  → rebuild API image after code changes
#   docker compose down        → stop and remove containers
#
# This mirrors the production layout (API + Redis + nginx) so you can catch
# infrastructure bugs locally before they reach the VPS.

version: '3.9'

services:

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: menorah-redis
    restart: unless-stopped
    ports:
      - "6379:6379"               # expose locally so you can use redis-cli
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./menorah/backend
      dockerfile: Dockerfile
    container_name: menorah-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      REDIS_URL: redis://redis:6379       # uses service name as hostname inside Docker network
      BOOKING_PAYMENTS_ENABLED: ${BOOKING_PAYMENTS_ENABLED:-false}
      PAYOUTS_ENABLED: ${PAYOUTS_ENABLED:-false}
      PAYMENT_WEBHOOK_MAX_PROCESSING_ATTEMPTS: ${PAYMENT_WEBHOOK_MAX_PROCESSING_ATTEMPTS:-}
      SUBSCRIPTION_PAYMENTS_ENABLED: "false"
    env_file:
      - ./menorah/backend/.env            # loads all other secrets (MONGODB_URI, JWT_SECRET, etc.)
    ports:
      - "3000:8080"                       # host:3000 → container:8080
    volumes:
      - api_logs:/app/logs
      - api_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── nginx reverse proxy ───────────────────────────────────────────────────
  # Only used locally to test the nginx config.
  # In production, nginx runs directly on the VPS (not in Docker) for performance.
  nginx:
    image: nginx:1.25-alpine
    container_name: menorah-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  api_logs:
  api_uploads:
