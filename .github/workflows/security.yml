name: Security gates

on:
  pull_request:
  push:
    branches: [main, 'release/**', security/account-auth-hardening]
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret history scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Scan all reachable commits
        run: >-
          docker run --rm --network none
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --exit-code 1

  sast:
    name: OWASP SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run Semgrep
        run: >-
          docker run --rm
          -v "$PWD:/src:ro"
          semgrep/semgrep:1.164.0@sha256:207983631beecdbe7fa29196c7f4a7a5f29033933cdb76c687ce4a672e07618d
          semgrep scan --config p/owasp-top-ten --error --metrics=off
          /src/menorah/backend/src
          /src/menorah/user-web-app/src
          /src/menorah/web-app/src
          /src/menorah/admin-panel/src
          /src/menorah/mobile-app/src

  dependency-audit:
    name: Audit ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - menorah/backend
          - menorah/user-web-app
          - menorah/web-app
          - menorah/admin-panel
          - menorah/scripts/qa
          - menorah/mobile-app
          - menorah/mobile-app/mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Audit production dependency lock
        run: node .github/scripts/audit-production.mjs "${{ matrix.project }}"

  container-security:
    name: Scan ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: menorah/backend
          - name: user-web
            context: menorah/user-web-app
          - name: counsellor-web
            context: menorah/web-app
          - name: admin-web
            context: menorah/admin-panel
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build commit image
        run: >-
          docker build
          --build-arg "NEXT_PUBLIC_CALLS_URL=https://calls.security-test.invalid"
          --tag "menorah-${{ matrix.name }}:${GITHUB_SHA}"
          "${{ matrix.context }}"
      - name: Scan image for high and critical vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
          image --scanners vuln --exit-code 1
          --severity HIGH,CRITICAL --skip-version-check
          "menorah-${{ matrix.name }}:${GITHUB_SHA}"
      - name: Generate CycloneDX SBOM
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$RUNNER_TEMP:/output"
          anchore/syft:v1.44.0@sha256:86fde6445b483d902fe011dd9f68c4987dd94e07da1e9edc004e3c2422650de6
          "menorah-${{ matrix.name }}:${GITHUB_SHA}"
          -o "cyclonedx-json=/output/${{ matrix.name }}-sbom.cdx.json"
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.name }}-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  mobile-diagnostics:
    name: Expo diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: menorah/mobile-app/package-lock.json
      - name: Install supported Expo dependency chain
        working-directory: menorah/mobile-app
        run: npm ci
      - name: Lint mobile app
        working-directory: menorah/mobile-app
        run: npm run lint
      - name: Typecheck mobile app
        working-directory: menorah/mobile-app
        run: npm run typecheck
      - name: Run Expo diagnostics
        working-directory: menorah/mobile-app
        run: npx expo-doctor

  required-security-gates:
    name: Required security gates
    if: ${{ always() }}
    needs:
      - secret-scan
      - sast
      - dependency-audit
      - container-security
      - mobile-diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every security job to pass
        shell: bash
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          CONTAINER_SECURITY_RESULT: ${{ needs.container-security.result }}
          MOBILE_DIAGNOSTICS_RESULT: ${{ needs.mobile-diagnostics.result }}
        run: |
          set -euo pipefail
          for result in \
            "${SECRET_SCAN_RESULT}" \
            "${SAST_RESULT}" \
            "${DEPENDENCY_AUDIT_RESULT}" \
            "${CONTAINER_SECURITY_RESULT}" \
            "${MOBILE_DIAGNOSTICS_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::At least one required security job did not pass."
              exit 1
            fi
          done
