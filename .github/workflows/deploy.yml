name: Production Release Readiness

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: Production release readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}

    steps:
      - name: Validate immutable candidate input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Candidate must be an exact lowercase 40-character commit SHA."
            exit 1
          fi

      - name: Checkout candidate exactly
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "${checked_out_sha}" = "${CANDIDATE_SHA}"
          test "${#checked_out_sha}" -eq 40
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          {
            printf 'event=%s\n' "${GITHUB_EVENT_NAME}"
            printf 'candidateCommit=%s\n' "${checked_out_sha}"
            printf 'candidateTree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install deterministic validator dependencies
        working-directory: menorah/scripts/qa
        run: npm ci --ignore-scripts

      - name: Install deterministic backend production dependencies
        working-directory: menorah/backend
        run: npm ci --omit=dev --ignore-scripts

      - name: Validate workflow and release safety invariants
        working-directory: menorah/scripts/qa
        run: |
          npm run test:release-workflow
          npm run test:tunnel-config
          npm run test:media-recovery
          docker run --rm --network none \
            -v "${GITHUB_WORKSPACE}/menorah:/workspace:ro" \
            -w /workspace \
            node:22-bookworm@sha256:5647be709086c696ff32edaaf1c70cd26d1da6ab2b39c32f3c7b4c4a31957e37 \
            bash scripts/qa/test-media-transition.sh
          npm run test:mongo-identities
          npm run test:backup-lifecycle
          npm run test:monitoring
          bash test-release-scripts.sh
          bash test-mongosh-file-mode.sh

      - name: Validate production Compose configuration
        run: bash menorah/deploy/ubuntu/validate-compose.sh

      - name: Validate release shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            menorah/deploy/ubuntu/*.sh \
            menorah/deploy/server-staging/*.sh \
            menorah/scripts/qa/test-release-scripts.sh \
            menorah/scripts/qa/validate-server-staging-isolation.sh
          do
            bash -n "${script}"
          done

# This workflow is intentionally read-only. It never authenticates to a
# registry, host, cloud account, or production environment and never deploys.
# The only production release path is the operator-invoked guarded Compose
# script documented in menorah/docs/production-update-runbook.md.
