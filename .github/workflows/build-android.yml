name: Build Android AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: menorah/mobile-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: menorah/mobile-app
        run: npm ci

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          test -n "${ANDROID_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/menorah-release.keystore"
          test -s "${RUNNER_TEMP}/menorah-release.keystore"

      - name: Make gradlew executable
        run: chmod +x menorah/mobile-app/android/gradlew

      - name: Build Android AAB
        working-directory: menorah/mobile-app/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/menorah-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Remove signing material
        if: always()
        run: rm -f "${RUNNER_TEMP}/menorah-release.keystore"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release
          path: menorah/mobile-app/android/app/build/outputs/bundle/release/*.aab
