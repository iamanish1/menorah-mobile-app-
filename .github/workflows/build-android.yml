name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: menorah/mobile-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: menorah/mobile-app
        run: npm install

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > menorah/mobile-app/android/app/release.keystore

      - name: Inject signing config into gradle.properties
        run: |
          {
            echo "ANDROID_KEYSTORE_FILE=release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "reactNativeArchitectures=arm64-v8a,x86_64"
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          } >> menorah/mobile-app/android/gradle.properties

      - name: Make gradlew executable
        run: chmod +x menorah/mobile-app/android/gradlew

      - name: Build Android AAB
        working-directory: menorah/mobile-app/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: menorah/mobile-app/android/app/build/outputs/bundle/release/*.aab
