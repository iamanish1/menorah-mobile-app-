# Production Cloud Run deployment is intentionally disabled.
#
# This is a fail-closed tombstone at the former `gcloud run services replace`
# input path. It is intentionally not a Knative Service manifest, so an
# overlooked legacy command cannot mutate Cloud Run. Use the reviewed Ubuntu
# guarded Compose release runbook instead.
#
# Retired feature state (documentation only):
#   BOOKING_PAYMENTS_ENABLED=false
#   PAYOUTS_ENABLED=false
# Retired dedicated payout secret declarations remain in:
#   legacy/cloudrun.yaml.disabled

disabledProductionDeployment:
  platform: cloud-run
  disabled: true
  authoritativeMethod: menorah/deploy/ubuntu/update-from-git.sh
