# ── Menorah Health — nginx reverse proxy ──────────────────────────────────
# Place this file at /etc/nginx/sites-available/menorahhealth on the VPS.
# Enable: ln -s /etc/nginx/sites-available/menorahhealth /etc/nginx/sites-enabled/
# Reload:  nginx -t && systemctl reload nginx

# Upstream — PM2 cluster workers all listen on port 3000
upstream menorah_api {
    least_conn;                          # route to the worker with fewest active connections
    server 127.0.0.1:3000;
    keepalive 64;                        # persistent upstream connections (saves TCP handshake per request)
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.menorahhealth.app;

    # Allow Let's Encrypt ACME challenge through before cert exists
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS API server ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.menorahhealth.app;

    # SSL — managed by Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.menorahhealth.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.menorahhealth.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Gzip compression ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        text/xml;
    gzip_min_length 1024;

    # ── Request size limits ───────────────────────────────────────────────
    client_max_body_size 25m;          # supports multipart eKYC selfie uploads
    client_body_timeout  30s;
    client_header_timeout 15s;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                    always;
    add_header X-Frame-Options         "DENY"                       always;
    # X-XSS-Protection removed — deprecated and can cause issues in older browsers; rely on CSP instead
    add_header X-XSS-Protection        "0"                          always;
    add_header Referrer-Policy         "strict-origin"              always;
    add_header Content-Security-Policy "default-src 'none'"         always;

    # ── Health check — no logging, fast path ──────────────────────────────
    location = /health {
        proxy_pass         http://menorah_api;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── Socket.IO — WebSocket upgrade ─────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://menorah_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long timeout — WebSocket connections are long-lived
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    # ── Locally hosted Social Studio media ────────────────────────────────
    # Rendered Instagram images and uploaded brand assets are stored on the
    # VPS under /opt/menorah/uploads and served by the backend at /uploads.
    location /uploads/ {
        proxy_pass         http://menorah_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # ── All other API routes ───────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://menorah_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";            # enable keepalive to upstream
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # Buffer responses to avoid slow client connections blocking upstream workers
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
    }

    # ── Block common exploit probes ───────────────────────────────────────
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }
}

# ── LiveKit WebRTC server (VPS-3) ──────────────────────────────────────────
# Note: This block lives in the nginx.conf on VPS-3, not VPS-1/2.
# VPS-3 runs LiveKit + nginx for this subdomain only.

server {
    listen 80;
    listen [::]:80;
    server_name livekit.menorahhealth.app;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name livekit.menorahhealth.app;

    ssl_certificate     /etc/letsencrypt/live/livekit.menorahhealth.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.menorahhealth.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # LiveKit uses WebSocket for signalling and HTTP for its REST API.
    # Both must be proxied with upgrade support.
    location / {
        proxy_pass         http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebRTC signalling connections are long-lived
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }
}
