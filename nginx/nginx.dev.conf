# Local dev nginx config — HTTP only, forwards to the API container
upstream menorah_api {
    least_conn;
    server api:8080;         # 'api' resolves to the Docker container via Docker DNS
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_types application/json application/javascript text/plain text/css;
    gzip_min_length 1024;

    client_max_body_size 10m;

    location = /health {
        proxy_pass http://menorah_api;
        access_log off;
    }

    location /socket.io/ {
        proxy_pass         http://menorah_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass         http://menorah_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}
