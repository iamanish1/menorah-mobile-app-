name: "${MENORAH_SERVER_STAGING_PROJECT_NAME:-menorah-staging}"

# Co-host-safe server staging. The checked-in file contains no credentials and
# never joins production resources. The env file path is supplied explicitly by
# the launcher; production and server-staging env files are never interchangeable.
x-generated-env-file: &generated-env-file
  "${MENORAH_SERVER_STAGING_ENV_FILE:?Set the absolute server-staging env file path}"

x-staging-resource-labels: &staging-resource-labels
  com.menorah.environment: staging
  com.menorah.project: "${MENORAH_SERVER_STAGING_PROJECT_NAME:-menorah-staging}"
  com.menorah.stack: server-staging
  com.menorah.managed-by: docker-compose

x-staging-service-labels: &staging-service-labels
  <<: *staging-resource-labels
  com.menorah.resource-kind: service

x-staging-service-common: &staging-service-common
  restart: "on-failure:3"
  labels: *staging-service-labels
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  pids_limit: 64
  mem_limit: 192m
  mem_reservation: 48m
  cpus: "0.15"
  cpu_shares: 64

x-backend-environment: &backend-environment
  NODE_ENV: production
  DEPLOYMENT_ENVIRONMENT: staging
  MENORAH_SERVER_STAGING_ENVIRONMENT_ID: "${MENORAH_SERVER_STAGING_ENVIRONMENT_ID:?Generated environment identity required}"
  MENORAH_SERVER_STAGING_PROJECT_NAME: "${MENORAH_SERVER_STAGING_PROJECT_NAME:-menorah-staging}"
  MENORAH_SERVER_STAGING_HTTPS_PORT: "${MENORAH_SERVER_STAGING_HTTPS_PORT:?Generated local HTTPS port required}"
  MENORAH_SYNTHETIC_DATA_ONLY: "${MENORAH_SYNTHETIC_DATA_ONLY:?Synthetic-only staging guard required}"
  MENORAH_STAGING_ALLOWED_HOSTS: "${MENORAH_STAGING_ALLOWED_HOSTS:?Required in generated local staging env}"
  MENORAH_STAGING_EMAIL_DOMAIN: "${MENORAH_STAGING_EMAIL_DOMAIN:?Required in generated local staging env}"
  SERVICE_RUNTIME: server-staging
  PORT: "8080"
  ROOT_DOMAIN: "${ROOT_DOMAIN:?Required in generated local staging env}"
  WWW_DOMAIN: "${WWW_DOMAIN:?Required in generated local staging env}"
  APP_DOMAIN: "${APP_DOMAIN:?Required in generated local staging env}"
  ADMIN_DOMAIN: "${ADMIN_DOMAIN:?Required in generated local staging env}"
  COUNSELLOR_DOMAIN: "${COUNSELLOR_DOMAIN:?Required in generated local staging env}"
  API_IOS_DOMAIN: "${API_IOS_DOMAIN:?Required in generated local staging env}"
  API_ANDROID_DOMAIN: "${API_ANDROID_DOMAIN:?Required in generated local staging env}"
  API_WEB_DOMAIN: "${API_WEB_DOMAIN:?Required in generated local staging env}"
  API_ADMIN_DOMAIN: "${API_ADMIN_DOMAIN:?Required in generated local staging env}"
  CALLS_DOMAIN: "${CALLS_DOMAIN:?Required in generated local staging env}"
  FRONTEND_API_WEB_URL: "${FRONTEND_API_WEB_URL:?Required in generated local staging env}"
  FRONTEND_API_ADMIN_URL: "${FRONTEND_API_ADMIN_URL:?Required in generated local staging env}"
  FRONTEND_COUNSELLOR_URL: "${FRONTEND_COUNSELLOR_URL:?Required in generated local staging env}"
  FRONTEND_SOCKET_WEB_URL: "${FRONTEND_SOCKET_WEB_URL:?Required in generated local staging env}"
  LIVEKIT_URL: "${LIVEKIT_URL:?Required in generated local staging env}"
  LIVEKIT_API_URL: "${LIVEKIT_API_URL:?Required in generated local staging env}"
  LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?Required in generated local staging env}"
  LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?Required in generated local staging env}"
  CALLING_REGION_MODE: "${CALLING_REGION_MODE:-staging}"
  LIVEKIT_BLOCKED_COUNTRIES: ""
  CALL_JOIN_EARLY_MINUTES: "${CALL_JOIN_EARLY_MINUTES:-15}"
  CALL_JOIN_LATE_GRACE_MINUTES: "${CALL_JOIN_LATE_GRACE_MINUTES:-15}"
  VIDEO_MEET_TICKET_TTL_SECONDS: "${VIDEO_MEET_TICKET_TTL_SECONDS:-120}"
  BLOCKED_COUNTRY_CALL_PROVIDER: livekit
  BLOCK_LIVEKIT_FOR_UAE: "false"
  BLOCK_LIVEKIT_FOR_UNKNOWN_REGION: "false"
  UAE_CALL_PROVIDER: livekit
  UAE_CALLING_ENABLED: "false"
  VSEE_ENABLED: "false"
  VSEE_INTEGRATION_MODE: external_link
  DOXY_ENABLED: "false"
  ZOOM_ENABLED: "false"
  GOOGLE_MEET_ENABLED: "false"
  TEAMS_ENABLED: "false"
  MONGODB_URI: "${MONGODB_URI:?Required in generated local staging env}"
  MONGODB_REPLICA_SET_NAME: menorah-staging-rs
  MONGODB_READ_PREFERENCE: primaryPreferred
  MONGODB_RETRY_WRITES: "true"
  REDIS_URL: "${REDIS_URL:?Required in generated local staging env}"
  SERVER_USAGE_LABEL: Co-host-isolated server staging
  SERVER_USAGE_PATH: ""
  JWT_SECRET: "${JWT_SECRET:?Required in generated local staging env}"
  JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Required in generated local staging env}"
  JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
  JWT_REFRESH_EXPIRES_IN: "${JWT_REFRESH_EXPIRES_IN:-30d}"
  ADMIN_JWT_EXPIRES_IN: "${ADMIN_JWT_EXPIRES_IN:-30m}"
  ADMIN_MFA_REQUIRED: "true"
  TRUST_PROXY: "${MENORAH_SERVER_STAGING_CADDY_APP_IP:?Reviewed staging Caddy app IP required}"
  GOOGLE_WEB_CLIENT_ID: ""
  GOOGLE_IOS_CLIENT_ID: ""
  GOOGLE_ANDROID_CLIENT_ID: ""
  APPLE_SIGN_IN_ENABLED: "false"
  APPLE_IOS_BUNDLE_ID: ""
  APPLE_WEB_SERVICE_ID: ""
  APPLE_TEAM_ID: ""
  APPLE_KEY_ID: ""
  APPLE_PRIVATE_KEY: ""
  ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:?Required in generated local staging env}"
  WEB_SESSION_ORIGINS: "${WEB_SESSION_ORIGINS:?Required in generated local staging env}"
  ENABLE_SOCKET_IO: "${ENABLE_SOCKET_IO:-true}"
  ENABLE_SOCKET_ADAPTER: "${ENABLE_SOCKET_ADAPTER:-true}"
  WORKER_MODE: "${WORKER_MODE:-active}"
  ENABLE_ARTICLE_SCHEDULER: "false"
  ENABLE_SOCIAL_SCHEDULER: "false"
  SOCIAL_STUDIO_ENABLED: "false"
  SOCIAL_STUDIO_AUTO_PUBLISH: "false"
  SOCIAL_STUDIO_OPENAI_API_KEY: ""
  SOCIAL_TOKEN_ENCRYPTION_KEY: ""
  META_APP_ID: ""
  META_APP_SECRET: ""
  ENABLE_BACKUP_JOBS: "false"
  ENABLE_EMAIL_JOBS: "false"
  ENABLE_NOTIFICATION_JOBS: "false"
  MENORAH_BACKUP_ROOT: /opt/menorah-staging/backups
  BACKUP_AUTOMATION_ENABLED: "false"
  BACKUP_EXPECT_RAID: "false"
  BACKUP_RAID_DEVICE: ""
  BACKUP_MAX_AGE_HOURS: "${BACKUP_MAX_AGE_HOURS:-24}"
  BACKUP_RESTORE_TEST_MAX_AGE_HOURS: "${BACKUP_RESTORE_TEST_MAX_AGE_HOURS:-24}"
  BACKUP_DISK_USAGE_MAX_PERCENT: "${BACKUP_DISK_USAGE_MAX_PERCENT:-80}"
  BACKUP_COLD_STORAGE_LABEL: Isolated server-staging volume
  SIX_HOURLY_RETENTION_DAYS: "${SIX_HOURLY_RETENTION_DAYS:-7}"
  DAILY_RETENTION_DAYS: "${DAILY_RETENTION_DAYS:-30}"
  WEEKLY_RETENTION_DAYS: "${WEEKLY_RETENTION_DAYS:-84}"
  MONTHLY_RETENTION_DAYS: "${MONTHLY_RETENTION_DAYS:-366}"
  PASSWORD_RESET_BASE_URL: "${PASSWORD_RESET_BASE_URL:?Required in generated local staging env}"
  LUXAND_API_TOKEN: ""
  OPENAI_API_KEY: ""
  DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:?Synthetic data encryption key required}"
  AUDIT_LOG_SIGNING_KEY: "${AUDIT_LOG_SIGNING_KEY:?Synthetic audit signing key required}"
  SECURITY_AUDIT_PENDING_MAX: "${SECURITY_AUDIT_PENDING_MAX:-1024}"
  MAX_PAYOUT_AMOUNT_PAISE: "${MAX_PAYOUT_AMOUNT_PAISE:?Required in generated local staging env}"
  KYC_CONSENT_VERSION: "${KYC_CONSENT_VERSION:?Required in generated local staging env}"
  KYC_RETENTION_DAYS: "${KYC_RETENTION_DAYS:?Required in generated local staging env}"
  PRIVACY_NOTICE_VERSION: "${PRIVACY_NOTICE_VERSION:?Required in generated local staging env}"
  ADMIN_ROLE_GRANTS_JSON: "${ADMIN_ROLE_GRANTS_JSON:?Synthetic admin role grants required}"
  BOOKING_SERVICE_CATALOG_JSON: "${BOOKING_SERVICE_CATALOG_JSON:?Synthetic booking catalog required}"
  PRIVACY_RETENTION_EXECUTION_ENABLED: "false"
  PRIVACY_ADMIN_PERMISSION_GRANTS_JSON: "${PRIVACY_ADMIN_PERMISSION_GRANTS_JSON:?Synthetic privacy grants required}"
  PRIVACY_RETENTION_POLICY_JSON: "${PRIVACY_RETENTION_POLICY_JSON:?Synthetic privacy policy required}"
  PRIVACY_RETENTION_BATCH_SIZE: "${PRIVACY_RETENTION_BATCH_SIZE:-25}"
  COUNSELLOR_ONBOARDING_CONSENT_VERSION: "${COUNSELLOR_ONBOARDING_CONSENT_VERSION:?Required in generated local staging env}"
  COUNSELLOR_CREDENTIAL_POLICY_VERSION: "${COUNSELLOR_CREDENTIAL_POLICY_VERSION:?Required in generated local staging env}"
  COUNSELLOR_ONBOARDING_NOTICE_URL: "${COUNSELLOR_ONBOARDING_NOTICE_URL:?Required in generated local staging env}"

x-booking-provider-environment: &booking-provider-environment
  BOOKING_PAYMENTS_ENABLED: "${BOOKING_PAYMENTS_ENABLED:?Booking payment gate required}"
  SUBSCRIPTION_PAYMENTS_ENABLED: "false"
  RAZORPAY_MODE: "${RAZORPAY_MODE:?Razorpay test mode required}"
  RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
  RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
  PAYMENT_WEBHOOK_MAX_PROCESSING_ATTEMPTS: "${PAYMENT_WEBHOOK_MAX_PROCESSING_ATTEMPTS:?Payment webhook retry limit required}"
  CHECKOUT_RETURN_URL: "${CHECKOUT_RETURN_URL:-}"

x-booking-webhook-environment: &booking-webhook-environment
  RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET:-}"
  RAZORPAY_WEBHOOK_SECRET_PREVIOUS: "${RAZORPAY_WEBHOOK_SECRET_PREVIOUS:-}"

x-payout-provider-environment: &payout-provider-environment
  PAYOUTS_ENABLED: "${PAYOUTS_ENABLED:?Payout gate required}"
  RAZORPAY_X_MODE: "${RAZORPAY_X_MODE:?RazorpayX test mode required}"
  RAZORPAY_X_KEY_ID: "${RAZORPAY_X_KEY_ID:-}"
  RAZORPAY_X_KEY_SECRET: "${RAZORPAY_X_KEY_SECRET:-}"
  RAZORPAY_X_WEBHOOK_SECRET: "${RAZORPAY_X_WEBHOOK_SECRET:-}"
  RAZORPAY_PAYOUT_ACCOUNT_NUMBER: "${RAZORPAY_PAYOUT_ACCOUNT_NUMBER:-}"

x-resend-provider-environment: &resend-provider-environment
  RESEND_PROVIDER_ENABLED: "${RESEND_PROVIDER_ENABLED:?Resend provider gate required}"
  RESEND_MODE: "${RESEND_MODE:?Resend sandbox mode required}"
  RESEND_API_KEY: "${RESEND_API_KEY:-}"
  RESEND_API_URL: "${RESEND_API_URL:-}"
  EMAIL_FROM: "${EMAIL_FROM:-}"
  CONTACT_TO_EMAIL: "${CONTACT_TO_EMAIL:-}"

x-cloudinary-provider-environment: &cloudinary-provider-environment
  MEDIA_STORAGE_BACKEND: "${MEDIA_STORAGE_BACKEND:?Media storage backend required}"
  CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:-}"
  CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:-}"
  CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:-}"
  CLOUDINARY_UPLOAD_PREFIX: "${CLOUDINARY_UPLOAD_PREFIX:?Cloudinary staging prefix required}"
  MEDIA_PUBLIC_BASE_URL: "${MEDIA_PUBLIC_BASE_URL:?Staging media public URL required}"
  UPLOAD_PATH: /app/uploads

x-app-security: &app-security
  <<: *staging-service-common
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 192
  mem_limit: 384m
  mem_reservation: 96m
  cpus: "0.30"
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777

x-backend-build: &backend-build
  image: "${MENORAH_SERVER_STAGING_BACKEND_IMAGE:?Set a server-staging backend image reference}"

services:
  staging-storage-init:
    <<: *staging-service-common
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: "no"
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        mkdir -p \
          /opt/menorah-staging/app \
          /opt/menorah-staging/data/backup-retrieval \
          /opt/menorah-staging/data/uploads \
          /opt/menorah-staging/data/managed-media \
          /opt/menorah-staging/data/restore \
          /opt/menorah-staging/data/restore-media \
          /opt/menorah-staging/backups/bundles \
          /opt/menorah-staging/deploy-state \
          /opt/menorah-staging/deploy-state/recovery \
          /opt/menorah-staging/logs \
          /opt/menorah-staging/env
        find /opt/menorah-staging -xdev -type l -print -quit | grep -q . && exit 1
        chmod 0700 \
          /opt/menorah-staging \
          /opt/menorah-staging/app \
          /opt/menorah-staging/data \
          /opt/menorah-staging/backups \
          /opt/menorah-staging/deploy-state \
          /opt/menorah-staging/logs \
          /opt/menorah-staging/env
    volumes: &staging-root-mounts
      - type: volume
        source: staging-filesystem-root
        target: /opt/menorah-staging
      - type: volume
        source: staging-app-root
        target: /opt/menorah-staging/app
      - type: volume
        source: staging-data-root
        target: /opt/menorah-staging/data
      - type: volume
        source: staging-backups
        target: /opt/menorah-staging/backups
      - type: volume
        source: staging-retrieval
        target: /opt/menorah-staging/data/backup-retrieval
      - type: volume
        source: staging-uploads
        target: /opt/menorah-staging/data/uploads
      - type: volume
        source: staging-managed-media
        target: /opt/menorah-staging/data/managed-media
      - type: volume
        source: staging-restore-root
        target: /opt/menorah-staging/data/restore
      - type: volume
        source: staging-restore-media
        target: /opt/menorah-staging/data/restore-media
      - type: bind
        source: "${MENORAH_SERVER_STAGING_DEPLOY_STATE_ROOT:?Set the isolated staging deploy-state host root}"
        target: /opt/menorah-staging/deploy-state
      - type: volume
        source: staging-logs
        target: /opt/menorah-staging/logs
      - type: volume
        source: staging-env-root
        target: /opt/menorah-staging/env

  staging-media-permissions-init:
    <<: [*staging-service-common, *backend-build]
    restart: "no"
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    network_mode: none
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        backend_uid="$$(id -u menorah)"
        backend_gid="$$(id -g menorah)"
        test "$${backend_uid}" -gt 0
        test "$${backend_gid}" -gt 0
        for media_root in /app/uploads /app/managed-media; do
          test -d "$${media_root}"
          test ! -L "$${media_root}"
          test "$$(readlink -f "$${media_root}")" = "$${media_root}"
          if find "$${media_root}" -xdev -type l -print -quit | grep -q .; then
            exit 1
          fi
          chown -R "$${backend_uid}:$${backend_gid}" "$${media_root}"
          chmod 0750 "$${media_root}"
        done
    volumes:
      - type: volume
        source: staging-uploads
        target: /app/uploads
      - type: volume
        source: staging-managed-media
        target: /app/managed-media
    depends_on:
      staging-storage-init:
        condition: service_completed_successfully

  staging-mongo-primary:
    <<: *staging-service-common
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    restart: "on-failure:3"
    pids_limit: 192
    mem_limit: 768m
    mem_reservation: 384m
    cpus: "0.75"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    entrypoint:
      - bash
      - -euc
      - |
        install -m 400 /mongo-keyfile-source/mongo-keyfile /data/db/mongo-keyfile
        exec docker-entrypoint.sh mongod \
          --bind_ip_all \
          --replSet menorah-staging-rs \
          --auth \
          --keyFile /data/db/mongo-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_STAGING_ROOT_USER:?Generated Mongo root user required}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_STAGING_ROOT_PASSWORD:?Generated Mongo root password required}"
      MONGO_INITDB_DATABASE: menorah_staging
      MONGO_STAGING_ROOT_USER: "${MONGO_STAGING_ROOT_USER:?Generated Mongo root user required}"
      MONGO_STAGING_ROOT_PASSWORD: "${MONGO_STAGING_ROOT_PASSWORD:?Generated Mongo root password required}"
    volumes:
      - type: volume
        source: staging-mongo
        target: /data/db
      - type: bind
        source: "${MENORAH_SERVER_STAGING_MONGO_KEYFILE:?Generate the local Mongo keyfile first}"
        target: /mongo-keyfile-source/mongo-keyfile
        read_only: true
    networks:
      - staging-data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1 --authenticationDatabase admin
          --username "$$MONGO_STAGING_ROOT_USER" --password "$$MONGO_STAGING_ROOT_PASSWORD"
          --eval "quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  staging-mongo-replica-init:
    <<: *staging-service-common
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    restart: "no"
    environment:
      MONGO_STAGING_ROOT_USER: "${MONGO_STAGING_ROOT_USER:?Generated Mongo root user required}"
      MONGO_STAGING_ROOT_PASSWORD: "${MONGO_STAGING_ROOT_PASSWORD:?Generated Mongo root password required}"
      MONGO_STAGING_APP_USER: "${MONGO_STAGING_APP_USER:?Generated Mongo application user required}"
      MONGO_STAGING_APP_PASSWORD: "${MONGO_STAGING_APP_PASSWORD:?Generated Mongo application password required}"
      MONGO_STAGING_MIGRATION_USER: "${MONGO_STAGING_MIGRATION_USER:?Generated Mongo migration user required}"
      MONGO_STAGING_MIGRATION_PASSWORD: "${MONGO_STAGING_MIGRATION_PASSWORD:?Generated Mongo migration password required}"
      MONGO_STAGING_BACKUP_USER: "${MONGO_STAGING_BACKUP_USER:?Generated Mongo backup user required}"
      MONGO_STAGING_BACKUP_PASSWORD: "${MONGO_STAGING_BACKUP_PASSWORD:?Generated Mongo backup password required}"
      MONGO_STAGING_RESTORE_USER: "${MONGO_STAGING_RESTORE_USER:?Generated Mongo restore user required}"
      MONGO_STAGING_RESTORE_PASSWORD: "${MONGO_STAGING_RESTORE_PASSWORD:?Generated Mongo restore password required}"
      MONGO_STAGING_MONITOR_USER: "${MONGO_STAGING_MONITOR_USER:?Generated Mongo monitor user required}"
      MONGO_STAGING_MONITOR_PASSWORD: "${MONGO_STAGING_MONITOR_PASSWORD:?Generated Mongo monitor password required}"
    command:
      - bash
      - -euc
      - |
        mongosh --nodb --quiet --eval '
          const admin = connect(
            "mongodb://staging-mongo-primary:27017/admin?authSource=admin",
            process.env.MONGO_STAGING_ROOT_USER,
            process.env.MONGO_STAGING_ROOT_PASSWORD
          );
          try {
            admin.adminCommand({ replSetGetStatus: 1 });
          } catch (error) {
            if (error.code !== 94 && error.codeName !== "NotYetInitialized") {
              throw error;
            }
            const initiated = admin.adminCommand({
              replSetInitiate: {
                _id: "menorah-staging-rs",
                members: [{ _id: 0, host: "staging-mongo-primary:27017" }],
              },
            });
            if (initiated.ok !== 1) throw new Error(`Replica initiation failed: $${tojson(initiated)}`);
          }
        '

        ready=false
        for attempt in $$(seq 1 60); do
          if mongosh --nodb --quiet --eval '
            const admin = connect(
              "mongodb://staging-mongo-primary:27017/admin?authSource=admin",
              process.env.MONGO_STAGING_ROOT_USER,
              process.env.MONGO_STAGING_ROOT_PASSWORD
            );
            quit(admin.hello().isWritablePrimary ? 0 : 1);
          '; then
            ready=true
            break
          fi
          sleep 2
        done
        test "$$ready" = true

        mongosh --nodb --quiet --eval '
          const admin = connect(
            "mongodb://staging-mongo-primary:27017/admin?authSource=admin",
            process.env.MONGO_STAGING_ROOT_USER,
            process.env.MONGO_STAGING_ROOT_PASSWORD
          );
          const identities = [
            {
              user: process.env.MONGO_STAGING_APP_USER,
              pwd: process.env.MONGO_STAGING_APP_PASSWORD,
              roles: [{ role: "readWrite", db: "menorah_staging" }],
            },
            {
              user: process.env.MONGO_STAGING_MIGRATION_USER,
              pwd: process.env.MONGO_STAGING_MIGRATION_PASSWORD,
              roles: [
                { role: "readWrite", db: "menorah_staging" },
                { role: "dbAdmin", db: "menorah_staging" },
              ],
            },
            {
              user: process.env.MONGO_STAGING_BACKUP_USER,
              pwd: process.env.MONGO_STAGING_BACKUP_PASSWORD,
              roles: [{ role: "backup", db: "admin" }],
            },
            {
              user: process.env.MONGO_STAGING_RESTORE_USER,
              pwd: process.env.MONGO_STAGING_RESTORE_PASSWORD,
              roles: [
                { role: "readWrite", db: "menorah_staging" },
                { role: "dbAdmin", db: "menorah_staging" },
              ],
            },
            {
              user: process.env.MONGO_STAGING_MONITOR_USER,
              pwd: process.env.MONGO_STAGING_MONITOR_PASSWORD,
              roles: [
                { role: "clusterMonitor", db: "admin" },
                { role: "read", db: "local" },
              ],
            },
          ];
          const normalize = (roles) => roles
            .map(({ role, db }) => `$${role}@$${db}`)
            .sort()
            .join(",");
          for (const identity of identities) {
            if (!identity.user || !identity.pwd) throw new Error("Managed Mongo identity is incomplete");
            const existing = admin.getUser(identity.user);
            if (!existing) {
              admin.createUser(identity);
            } else if (normalize(existing.roles) !== normalize(identity.roles)) {
              throw new Error(`Unexpected roles for managed Mongo user $${identity.user}`);
            }
            const credential = connect(
              "mongodb://staging-mongo-primary:27017/admin?authSource=admin",
              identity.user,
              identity.pwd
            );
            if (credential.runCommand({ connectionStatus: 1 }).ok !== 1) {
              throw new Error(`Credential verification failed for $${identity.user}`);
            }
          }
        '
    networks:
      - staging-data
    depends_on:
      staging-mongo-primary:
        condition: service_healthy

  staging-redis:
    <<: *staging-service-common
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: "on-failure:3"
    entrypoint:
      - sh
      - -euc
      - |
        umask 077
        case "$$REDIS_STAGING_USERNAME" in
          ''|default|*[!A-Za-z0-9_-]*) exit 64 ;;
        esac
        printf 'appendonly yes\nuser default off\nuser %s on >%s ~* &* +@all\n' \
          "$$REDIS_STAGING_USERNAME" "$$REDIS_STAGING_PASSWORD" >/run/redis/redis.conf
        chmod 0400 /run/redis/redis.conf
        exec redis-server /run/redis/redis.conf
    environment:
      REDIS_STAGING_USERNAME: "${REDIS_STAGING_USERNAME:?Set a unique staging Redis username}"
      REDIS_STAGING_PASSWORD: "${REDIS_STAGING_PASSWORD:?Set a unique staging Redis password}"
    read_only: true
    user: "999:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    volumes:
      - type: volume
        source: staging-redis
        target: /data
    tmpfs:
      - /run/redis:rw,noexec,nosuid,nodev,size=1m,mode=700,uid=999,gid=1000
    networks:
      - staging-data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$REDIS_STAGING_PASSWORD"
          redis-cli --no-auth-warning --user "$$REDIS_STAGING_USERNAME" ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

