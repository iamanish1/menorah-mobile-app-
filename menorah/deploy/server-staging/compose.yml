      retries: 30
      start_period: 20s

  staging-mongo-restore-replica-init:
    <<: *staging-service-common
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    profiles: ["recovery"]
    restart: "no"
    environment:
      MONGO_STAGING_ROOT_USER: "${MONGO_STAGING_ROOT_USER:?Generated Mongo root user required}"
      MONGO_STAGING_ROOT_PASSWORD: "${MONGO_STAGING_ROOT_PASSWORD:?Generated Mongo root password required}"
      MONGO_STAGING_RESTORE_USER: "${MONGO_STAGING_RESTORE_USER:?Generated Mongo restore user required}"
      MONGO_STAGING_RESTORE_PASSWORD: "${MONGO_STAGING_RESTORE_PASSWORD:?Generated Mongo restore password required}"
    command:
      - bash
      - -euc
      - |
        mongosh --nodb --quiet --eval '
          const admin = connect(
            "mongodb://staging-mongo-restore:27017/admin?authSource=admin",
            process.env.MONGO_STAGING_ROOT_USER,
            process.env.MONGO_STAGING_ROOT_PASSWORD
          );
          try {
            admin.adminCommand({ replSetGetStatus: 1 });
          } catch (error) {
            if (error.code !== 94 && error.codeName !== "NotYetInitialized") throw error;
            const initiated = admin.adminCommand({
              replSetInitiate: {
                _id: "menorah-staging-restore-rs",
                members: [{ _id: 0, host: "staging-mongo-restore:27017" }],
              },
            });
            if (initiated.ok !== 1) throw new Error(`Restore replica initiation failed: $${tojson(initiated)}`);
          }
        '
        ready=false
        for attempt in $$(seq 1 60); do
          if mongosh --nodb --quiet --eval '
            const admin = connect(
              "mongodb://staging-mongo-restore:27017/admin?authSource=admin",
              process.env.MONGO_STAGING_ROOT_USER,
              process.env.MONGO_STAGING_ROOT_PASSWORD
            );
            quit(admin.hello().isWritablePrimary ? 0 : 1);
          '; then
            ready=true
            break
          fi
          sleep 2
        done
        test "$$ready" = true

        mongosh --nodb --quiet --eval '
          const admin = connect(
            "mongodb://staging-mongo-restore:27017/admin?authSource=admin",
            process.env.MONGO_STAGING_ROOT_USER,
            process.env.MONGO_STAGING_ROOT_PASSWORD
          );
          const hello = admin.hello();
          if (
            !hello.isWritablePrimary
            || hello.setName !== "menorah-staging-restore-rs"
            || hello.primary !== "staging-mongo-restore:27017"
          ) {
            throw new Error("Disposable restore replica identity is invalid");
          }
          const expectedRoles = [
            { role: "readWrite", db: "menorah_staging" },
            { role: "dbAdmin", db: "menorah_staging" },
          ];
          const existing = admin.getUser(process.env.MONGO_STAGING_RESTORE_USER);
          if (!existing) {
            admin.createUser({
              user: process.env.MONGO_STAGING_RESTORE_USER,
              pwd: process.env.MONGO_STAGING_RESTORE_PASSWORD,
              roles: expectedRoles,
            });
          } else {
            const normalize = (roles) => roles
              .map(({ role, db }) => `$${role}@$${db}`)
              .sort()
              .join(",");
            if (normalize(existing.roles) !== normalize(expectedRoles)) {
              throw new Error("Disposable restore credential roles are invalid");
            }
          }
          const credential = connect(
            "mongodb://staging-mongo-restore:27017/admin?authSource=admin",
            process.env.MONGO_STAGING_RESTORE_USER,
            process.env.MONGO_STAGING_RESTORE_PASSWORD
          );
          if (credential.runCommand({ connectionStatus: 1 }).ok !== 1) {
            throw new Error("Disposable restore credential verification failed");
          }
        '
    networks:
      - staging-restore
    depends_on:
      staging-mongo-restore:
        condition: service_healthy

  staging-backup-job:
    <<: *staging-service-common
    image: "${MENORAH_SERVER_STAGING_BACKUP_TOOLS_IMAGE:?Set a server-staging backup-tools image reference}"
    build:
      context: .
      dockerfile: Dockerfile.backup-tools
    profiles: ["backup"]
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/backup-staging.sh"]
    environment:
      HOME: /tmp
      MONGODB_STAGING_BACKUP_URI: "${MONGODB_STAGING_BACKUP_URI:?Set the staging-only Mongo backup URI}"
      MENORAH_SERVER_STAGING_ENVIRONMENT_ID: "${MENORAH_SERVER_STAGING_ENVIRONMENT_ID:?Generated environment identity required}"
      COMPOSE_PROJECT_NAME: "${MENORAH_SERVER_STAGING_PROJECT_NAME:-menorah-staging}"
      MENORAH_RUNTIME_CANDIDATE_SHA: "${MENORAH_RUNTIME_CANDIDATE_SHA:?Generated runtime candidate SHA required}"
      MENORAH_SERVER_STAGING_RUNTIME_SHA: "${MENORAH_RUNTIME_CANDIDATE_SHA:?Generated runtime candidate SHA required}"
      MENORAH_STAGING_BACKUP_ACK: "${MENORAH_STAGING_BACKUP_ACK:-}"
      MENORAH_STAGING_WRITERS_QUIESCED: "${MENORAH_STAGING_WRITERS_QUIESCED:-}"
      MENORAH_STAGING_ROOTS_ACK: "${MENORAH_STAGING_ROOTS_ACK:-}"
      MENORAH_STAGING_ROOT: /opt/menorah-staging
      MENORAH_STAGING_APP_ROOT: /opt/menorah-staging/app
      MENORAH_STAGING_DATA_ROOT: /opt/menorah-staging/data
      MENORAH_STAGING_BACKUP_ROOT: /opt/menorah-staging/backups
      MENORAH_STAGING_DEPLOY_STATE_ROOT: /opt/menorah-staging/deploy-state
      MENORAH_STAGING_LOGS_ROOT: /opt/menorah-staging/logs
      MENORAH_STAGING_ENV_ROOT: /opt/menorah-staging/env
      MENORAH_STAGING_DATABASE: menorah_staging
      MENORAH_STAGING_REPLICA_SET: menorah-staging-rs
      MENORAH_STAGING_RETRIEVAL_ROOT: /opt/menorah-staging/data/backup-retrieval
      MENORAH_STAGING_MANAGED_MEDIA_ROOT: /opt/menorah-staging/data/managed-media
      MENORAH_SERVER_STAGING_BACKUP_METRICS_URL: "http://staging-alert-fixture:9101/control/backup"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./backup-staging.sh
        target: /scripts/backup-staging.sh
        read_only: true
      - type: volume
        source: staging-filesystem-root
        target: /opt/menorah-staging
        read_only: true
      - type: volume
        source: staging-app-root
        target: /opt/menorah-staging/app
        read_only: true
      - type: volume
        source: staging-data-root
        target: /opt/menorah-staging/data
        read_only: true
      - type: volume
        source: staging-backups
        target: /opt/menorah-staging/backups
      - type: volume
        source: staging-retrieval
        target: /opt/menorah-staging/data/backup-retrieval
      - type: volume
        source: staging-uploads
        target: /opt/menorah-staging/data/uploads
        read_only: true
      - type: volume
        source: staging-managed-media
        target: /opt/menorah-staging/data/managed-media
        read_only: true
      - type: bind
        source: "${MENORAH_SERVER_STAGING_DEPLOY_STATE_ROOT:?Set the isolated staging deploy-state host root}"
        target: /opt/menorah-staging/deploy-state
      - type: volume
        source: staging-logs
        target: /opt/menorah-staging/logs
        read_only: true
      - type: volume
        source: staging-env-root
        target: /opt/menorah-staging/env
        read_only: true
    secrets:
      - source: staging-backup-encryption-password
        target: menorah-staging-backup-encryption-key
        mode: 0400
      - source: staging-backup-integrity-hmac-key
        target: menorah-staging-backup-signing-key
        mode: 0400
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    networks:
      - staging-data
      - staging-monitoring
    depends_on:
      staging-storage-init:
        condition: service_completed_successfully
      staging-mongo-replica-init:
        condition: service_completed_successfully
      staging-alert-fixture:
        condition: service_healthy

  staging-restore-job:
    <<: *staging-service-common
    image: "${MENORAH_SERVER_STAGING_BACKUP_TOOLS_IMAGE:?Set a server-staging backup-tools image reference}"
    profiles: ["recovery"]
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/restore-staging.sh"]
    environment:
      HOME: /tmp
      MONGODB_STAGING_RESTORE_URI: "${MONGODB_STAGING_RESTORE_URI:?Set the isolated staging restore URI}"
      MENORAH_SERVER_STAGING_ENVIRONMENT_ID: "${MENORAH_SERVER_STAGING_ENVIRONMENT_ID:?Generated environment identity required}"
      COMPOSE_PROJECT_NAME: "${MENORAH_SERVER_STAGING_PROJECT_NAME:-menorah-staging}"
      MENORAH_RUNTIME_CANDIDATE_SHA: "${MENORAH_RUNTIME_CANDIDATE_SHA:?Generated runtime candidate SHA required}"
      MENORAH_SERVER_STAGING_RUNTIME_SHA: "${MENORAH_RUNTIME_CANDIDATE_SHA:?Generated runtime candidate SHA required}"
      MENORAH_STAGING_RESTORE_ACK: "${MENORAH_STAGING_RESTORE_ACK:-}"
      MENORAH_STAGING_ROOTS_ACK: "${MENORAH_STAGING_ROOTS_ACK:-}"
      MENORAH_STAGING_RESTORE_TARGET: staging-mongo-restore
      MENORAH_STAGING_ROOT: /opt/menorah-staging
      MENORAH_STAGING_APP_ROOT: /opt/menorah-staging/app
      MENORAH_STAGING_DATA_ROOT: /opt/menorah-staging/data
      MENORAH_STAGING_BACKUP_ROOT: /opt/menorah-staging/backups
      MENORAH_STAGING_DEPLOY_STATE_ROOT: /opt/menorah-staging/deploy-state
      MENORAH_STAGING_LOGS_ROOT: /opt/menorah-staging/logs
      MENORAH_STAGING_ENV_ROOT: /opt/menorah-staging/env
      MENORAH_STAGING_DATABASE: menorah_staging
      MENORAH_STAGING_REPLICA_SET: menorah-staging-rs
      MENORAH_STAGING_RETRIEVAL_ROOT: /opt/menorah-staging/data/backup-retrieval
      MENORAH_STAGING_RESTORE_ROOT: /opt/menorah-staging/data/restore
      MENORAH_STAGING_RESTORE_REPLICA_SET: menorah-staging-restore-rs
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./restore-staging.sh
        target: /scripts/restore-staging.sh
        read_only: true
      - type: volume
        source: staging-filesystem-root
        target: /opt/menorah-staging
        read_only: true
      - type: volume
        source: staging-app-root
        target: /opt/menorah-staging/app
        read_only: true
      - type: volume
        source: staging-data-root
        target: /opt/menorah-staging/data
        read_only: true
      - type: volume
        source: staging-backups
        target: /opt/menorah-staging/backups
        read_only: true
      - type: volume
        source: staging-retrieval
        target: /opt/menorah-staging/data/backup-retrieval
        read_only: true
      - type: volume
        source: staging-restore-root
        target: /opt/menorah-staging/data/restore
      - type: volume
        source: staging-restore-media
        target: /opt/menorah-staging/data/restore-media
      - type: bind
        source: "${MENORAH_SERVER_STAGING_DEPLOY_STATE_ROOT:?Set the isolated staging deploy-state host root}"
        target: /opt/menorah-staging/deploy-state
      - type: volume
        source: staging-logs
        target: /opt/menorah-staging/logs
        read_only: true
      - type: volume
        source: staging-env-root
        target: /opt/menorah-staging/env
        read_only: true
    secrets:
      - source: staging-backup-encryption-password
        target: menorah-staging-backup-encryption-key
        mode: 0400
      - source: staging-backup-integrity-hmac-key
        target: menorah-staging-backup-signing-key
        mode: 0400
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    networks:
      - staging-restore
    depends_on:
      staging-storage-init:
        condition: service_completed_successfully
      staging-mongo-restore-replica-init:
        condition: service_completed_successfully

configs:
  staging-blackbox-config:
    file: ./blackbox.yml
  staging-loki-config:
    file: ./loki.yml

secrets:
  staging-backup-encryption-password:
    file: "${MENORAH_SERVER_STAGING_BACKUP_PASSWORD_FILE:?Set the server-staging backup password file}"
  staging-backup-integrity-hmac-key:
    file: "${MENORAH_SERVER_STAGING_BACKUP_HMAC_FILE:?Set the server-staging backup HMAC file}"

# Defaults are provisional staging-only ranges. Discovery must prove they are
# unused on the co-host before any server dry render or deployment is approved.
networks:
  staging-ingress:
    name: "${MENORAH_SERVER_STAGING_RESOURCE_PREFIX:-menorah-staging}-ingress"
    driver: bridge
    internal: false
    labels:
      <<: *staging-resource-labels
      com.menorah.resource-kind: network
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
    ipam:
      config:
        - subnet: "${MENORAH_SERVER_STAGING_INGRESS_SUBNET:?Reviewed staging ingress subnet required}"
          ip_range: "${MENORAH_SERVER_STAGING_INGRESS_IP_RANGE:?Reviewed staging ingress dynamic range required}"
  staging-app:
    name: "${MENORAH_SERVER_STAGING_RESOURCE_PREFIX:-menorah-staging}-app"
    driver: bridge
    internal: true
    labels:
      <<: *staging-resource-labels
      com.menorah.resource-kind: network
    ipam:
      config:
        - subnet: "${MENORAH_SERVER_STAGING_APP_SUBNET:?Reviewed staging app subnet required}"
          ip_range: "${MENORAH_SERVER_STAGING_APP_IP_RANGE:?Reviewed staging app dynamic range required}"
  staging-data:
    name: "${MENORAH_SERVER_STAGING_RESOURCE_PREFIX:-menorah-staging}-data"
    driver: bridge
    internal: true
    labels:
      <<: *staging-resource-labels
      com.menorah.resource-kind: network
    ipam:
      config:
        - subnet: "${MENORAH_SERVER_STAGING_DATA_SUBNET:?Reviewed staging data subnet required}"
          ip_range: "${MENORAH_SERVER_STAGING_DATA_IP_RANGE:?Reviewed staging data dynamic range required}"
  staging-monitoring:
    name: "${MENORAH_SERVER_STAGING_RESOURCE_PREFIX:-menorah-staging}-monitoring"
    driver: bridge
    internal: true
    labels:
      <<: *staging-resource-labels
      com.menorah.resource-kind: network
    ipam:
      config:
        - subnet: "${MENORAH_SERVER_STAGING_MONITORING_SUBNET:?Reviewed staging monitoring subnet required}"
          ip_range: "${MENORAH_SERVER_STAGING_MONITORING_IP_RANGE:?Reviewed staging monitoring dynamic range required}"
  staging-restore:
    name: "${MENORAH_SERVER_STAGING_RESOURCE_PREFIX:-menorah-staging}-restore"
    driver: bridge
    internal: true
    labels:
      <<: *staging-resource-labels
      com.menorah.resource-kind: network
    ipam:
      config:
        - subnet: "${MENORAH_SERVER_STAGING_RESTORE_SUBNET:?Reviewed staging restore subnet required}"
          ip_range: "${MENORAH_SERVER_STAGING_RESTORE_IP_RANGE:?Reviewed staging restore dynamic range required}"
  staging-egress:
    name: "${MENORAH_SERVER_STAGING_RESOURCE_PREFIX:-menorah-staging}-egress"
    driver: bridge
    internal: false
# This bridge is egress-capable NAT, not a destination/FQDN allowlist.
# Server firewall or proxy restrictions remain discovery-time evidence.
    labels:
      <<: *staging-resource-labels
      com.menorah.resource-kind: network
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
    ipam:
      config:
        - subnet: "${MENORAH_SERVER_STAGING_EGRESS_SUBNET:?Reviewed staging egress subnet required}"
          ip_range: "${MENORAH_SERVER_STAGING_EGRESS_IP_RANGE:?Reviewed staging egress dynamic range required}"

volumes:
  staging-filesystem-root:
    name: "${MENORAH_SERVER_STAGING_RESOURCE_PREFIX:-menorah-staging}-filesystem-root"
