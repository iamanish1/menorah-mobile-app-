  staging-logs-init:
    <<: *staging-service-common
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: "no"
    entrypoint:
      - /bin/sh
      - -euc
    command:
      - |
        test -d /var/log/menorah
        test ! -L /var/log/menorah
        chown 0:0 /var/log/menorah
        chmod 0700 /var/log/menorah
        find /var/log/menorah -xdev -type f -name 'caddy-access*' \
          -exec chown 0:0 {} +
        find /var/log/menorah -xdev -type f -name 'caddy-access*' \
          -exec chmod 0600 {} +
        find /var/log/menorah -xdev -type f -name 'caddy-access*' \
          -exec chown 473:473 {} +
        chown 473:473 /var/log/menorah
        for caddy_root in /config /data; do
          test -d "$${caddy_root}"
          test ! -L "$${caddy_root}"
          test "$$(readlink -f "$${caddy_root}")" = "$${caddy_root}"
          if find "$${caddy_root}" -xdev -type l -print -quit | grep -q .; then
            exit 1
          fi
          chown -R 0:0 "$${caddy_root}"
          find "$${caddy_root}" -xdev -type d -exec chmod 0700 {} +
