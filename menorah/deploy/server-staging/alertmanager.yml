global:
  resolve_timeout: 1m

route:
  receiver: unmatched-drop
  group_by:
    - environment
    - alertname
    - service
    - severity
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 30m
  routes:
    - receiver: server-staging-placeholder
      matchers:
        - environment="staging"

# Placeholder-only receiver: it reaches an isolated in-project sink and carries
# no production notification token, address, team, or escalation destination.
receivers:
  - name: unmatched-drop
  - name: server-staging-placeholder
    webhook_configs:
      - url: http://staging-alert-sink:9099/alerts
        send_resolved: true
        http_config:
          follow_redirects: false

inhibit_rules:
  - source_matchers:
      - environment="staging"
      - severity="critical"
    target_matchers:
      - environment="staging"
      - severity="warning"
    equal:
      - environment
      - alertname
      - service
