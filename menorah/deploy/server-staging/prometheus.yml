global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: staging
    stack: menorah-staging
    compose_project: menorah-staging
    monitoring_scope: server-staging

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - staging-alertmanager:9093
          labels:
            environment: staging
            monitoring_scope: server-staging

rule_files:
  # The shared source contains the complete production P0 rule set. External
  # labels above make every resulting staging incident unambiguous.
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: blackbox-http-internal
    metrics_path: /probe
    params:
      module: [http_success]
    static_configs:
      - targets: [http://staging-api-ios:8080/health/ready]
        labels: {environment: staging, monitoring_scope: server-staging, component: api, service: api-ios, probe_module: http_ready}
      - targets: [http://staging-api-android:8080/health/ready]
        labels: {environment: staging, monitoring_scope: server-staging, component: api, service: api-android, probe_module: http_ready}
      - targets: [http://staging-api-web:8080/health/ready]
        labels: {environment: staging, monitoring_scope: server-staging, component: api, service: api-web, probe_module: http_ready}
      - targets: [http://staging-api-admin:8080/health/ready]
        labels: {environment: staging, monitoring_scope: server-staging, component: api, service: api-admin, probe_module: http_ready}
      - targets: [http://staging-worker:8080/health/ready]
        labels: {environment: staging, monitoring_scope: server-staging, component: worker, service: worker, probe_module: http_ready}
      - targets: [http://staging-user-web-app:3002/]
        labels: {environment: staging, monitoring_scope: server-staging, component: frontend, service: landing-page, probe_module: http_success}
      - targets: [http://staging-user-web-app:3002/]
        labels: {environment: staging, monitoring_scope: server-staging, component: frontend, service: user-web-app, probe_module: http_success}
      - targets: [http://staging-web-app:3001/]
        labels: {environment: staging, monitoring_scope: server-staging, component: frontend, service: counsellor-web, probe_module: http_success}
      - targets: [http://staging-admin-panel:3003/]
        labels: {environment: staging, monitoring_scope: server-staging, component: frontend, service: admin-panel, probe_module: http_success}
    relabel_configs:
      - source_labels: [probe_module]
        target_label: __param_module
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: staging-blackbox-exporter:9115

  - job_name: blackbox-tcp-internal
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: [staging-livekit:7880]
        labels: {environment: staging, monitoring_scope: server-staging, component: calls, service: livekit}
      - targets: [staging-mongo-primary:27017]
        labels: {environment: staging, monitoring_scope: server-staging, component: datastore, service: mongodb}
      - targets: [staging-redis:6379]
        labels: {environment: staging, monitoring_scope: server-staging, component: datastore, service: redis}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: staging-blackbox-exporter:9115

  - job_name: blackbox-https-public
    metrics_path: /probe
    params:
      module: [https_staging]
    static_configs:
      - targets: [https://staging.menorah.me/]
        labels: {environment: staging, monitoring_scope: server-staging, component: frontend, service: public-site}
      - targets: [https://www.staging.menorah.me/]
        labels: {environment: staging, monitoring_scope: server-staging, component: frontend, service: public-site-www}
      - targets: [https://app.staging.menorah.me/]
        labels: {environment: staging, monitoring_scope: server-staging, component: frontend, service: user-web}
      - targets: [https://admin.staging.menorah.me/]
        labels: {environment: staging, monitoring_scope: server-staging, component: frontend, service: admin-web}
      - targets: [https://counsellor.staging.menorah.me/]
        labels: {environment: staging, monitoring_scope: server-staging, component: frontend, service: counsellor-web}
      - targets: [https://api-ios.staging.menorah.me/health/ready]
        labels: {environment: staging, monitoring_scope: server-staging, component: api, service: api-ios}
      - targets: [https://api-android.staging.menorah.me/health/ready]
        labels: {environment: staging, monitoring_scope: server-staging, component: api, service: api-android}
      - targets: [https://api-web.staging.menorah.me/health/ready]
        labels: {environment: staging, monitoring_scope: server-staging, component: api, service: api-web}
      - targets: [https://api-admin.staging.menorah.me/health/ready]
        labels: {environment: staging, monitoring_scope: server-staging, component: api, service: api-admin}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: staging-blackbox-exporter:9115

  - job_name: blackbox-https-calls
    metrics_path: /probe
    params:
      module: [https_calls_staging]
    static_configs:
      - targets: [https://calls.staging.menorah.me/]
        labels: {environment: staging, monitoring_scope: server-staging, component: calls, service: livekit-public}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: staging-blackbox-exporter:9115

  - job_name: security-events
    metrics_path: /metrics/security
    static_configs:
      - targets:
          - staging-api-ios:8080
          - staging-api-android:8080
          - staging-api-web:8080
          - staging-api-admin:8080
          - staging-worker:8080
        labels: {environment: staging, monitoring_scope: server-staging}

  - job_name: staging-alert-fixture
    static_configs:
      - targets: [staging-alert-fixture:9101]
        labels: {environment: staging, monitoring_scope: server-staging}

  - job_name: blackbox-exporter
    static_configs:
      - targets: [staging-blackbox-exporter:9115]
        labels: {environment: staging, monitoring_scope: server-staging}

  - job_name: mongodb-exporter
    static_configs:
      - targets: [staging-mongodb-exporter:9216]
        labels: {environment: staging, monitoring_scope: server-staging}

  - job_name: redis-exporter
    static_configs:
      - targets: [staging-redis-exporter:9121]
        labels: {environment: staging, monitoring_scope: server-staging}

  - job_name: alloy
    static_configs:
      - targets: [staging-alloy:12345]
        labels: {environment: staging, monitoring_scope: server-staging}

  - job_name: loki
    static_configs:
      - targets: [staging-loki:3100]
        labels: {environment: staging, monitoring_scope: server-staging}

  - job_name: alertmanager
    static_configs:
      - targets: [staging-alertmanager:9093]
        labels: {environment: staging, monitoring_scope: server-staging}

  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
        labels: {environment: staging, monitoring_scope: server-staging}
