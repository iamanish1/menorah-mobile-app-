schema_version: 1
signals:
  - id: api-availability
    status: covered
    source: blackbox-http-internal and blackbox-https-public
    alerts:
      - InternalApiProbeFailed
      - PublicEndpointProbeFailed
      - BlackboxProbeCoverageIncomplete

  - id: frontend-availability
    status: covered
    source: blackbox-http-internal and blackbox-https-public
    alerts:
      - InternalFrontendProbeFailed
      - UserFrontendProbeFailed
      - AdminFrontendProbeFailed
      - CounsellorFrontendProbeFailed
      - PublicEndpointProbeFailed

  - id: call-service-availability
    status: covered
    source: blackbox TCP and public HTTPS probes
    alerts:
      - CallServiceProbeFailed
      - PublicEndpointProbeFailed

  - id: mongodb-health
    status: covered
    source: Percona MongoDB exporter plus a TCP probe
    alerts:
      - MongoExporterDown
      - MongoUnavailable
      - MongoMetricsCoverageMissing
      - MongoReplicaNotPrimary
      - DatastoreTcpProbeFailed

  - id: redis-health
    status: covered
    source: Redis exporter plus a TCP probe
    alerts:
      - RedisExporterDown
      - RedisUnavailable
      - RedisMetricsCoverageMissing
      - RedisMemoryPressure
      - RedisRejectedConnections
      - DatastoreTcpProbeFailed

  - id: worker-readiness
    status: covered
    source: worker dependency-aware readiness endpoint through blackbox_exporter
    alerts:
      - WorkerReadinessProbeFailed

  - id: queue-backlog
    status: covered
    source: durable provider-revocation worker queue snapshots, outcomes, and heartbeat
    alerts:
      - WorkerQueueBacklogHigh

  - id: backup-age
    status: covered
    source: latest-success metadata exposed through node_exporter textfile collector
    alerts:
      - BackupMetricsStale
      - SixHourlyBackupTooOld
      - DailyBackupMissing
      - DailyBackupTooOld
      - WeeklyBackupTooOld
      - MonthlyBackupTooOld
      - RestoreTestTooOld

  - id: backup-immediate-failure
    status: covered
    source: bounded atomic systemd/direct execution state through node_exporter textfile collector
    alerts:
      - BackupJobFailed

  - id: host-capacity
    status: covered
    source: node_exporter
    alerts:
      - NodeExporterDown
      - HostDiskSpaceLow
      - HostCpuSaturation
      - HostMemoryPressure

  - id: container-restarts-and-memory
    status: covered
    source: sanitized container state and stats through the isolated repository gateway
    alerts:
      - ContainerMetricsDown
      - ContainerMetricsCoverageMissing
      - ContainerRestartLoop
      - ContainerMemoryNearLimit

  - id: tls-certificate-expiry
    status: covered
    source: blackbox HTTPS probes
    alerts:
      - TlsCertificateExpiringSoon

  - id: authentication-mfa-admin-events
    status: covered
    source: menorah_auth_attempts_total plus the signed menorah_security_events_total audit stream
    alerts:
      - UserAuthenticationFailureSpike
      - CounsellorAuthenticationFailureSpike
      - AdminAuthenticationMfaFailureSpike
      - AdminPermissionDenied
      - PrivilegedActionFailure
      - AdminChangeBurst
      - BankDetailsChanged
      - SecurityMetricsScrapeFailed
      - SecurityMetricsCoverageIncomplete

  - id: durable-security-audit-sink
    status: covered
    source: security audit sink metrics on all five security-events scrape targets
    alerts:
      - SecurityAuditEvidenceIntegrityFailure
      - SecurityAuditSinkPending
      - SecurityAuditSinkWriteFailures

  - id: specific-privilege-change-events
    status: covered
    source: User role-change model middleware emits a signed audit event plus menorah_privilege_changes_total
    alerts:
      - PrivilegedRoleChanged
      - AdminRoleChanged

  - id: payout-action-failures
    status: covered
    source: menorah_security_events_total event=payout_action
    alerts:
      - PayoutActionFailed

  - id: payment-webhook-terminal-reconciliation
    status: covered
    source: signed security events plus bounded Razorpay webhook outcome counters
    alerts:
      - PaymentWebhookReconciliationBlocked
      - PaymentWebhookFailure

  - id: general-payment-provider-failures
    status: covered
    source: bounded Razorpay order, evidence, verification, payout, and webhook outcome counters
    alerts:
      - PaymentProviderFailure
      - PaymentWebhookFailure

  - id: email-delivery-failures
    status: covered
    source: Resend dispatch outcomes plus signed replay-safe provider delivery callbacks
    alerts:
      - EmailDispatchFailed
      - EmailDeliveryOutcomeFailed

  - id: call-provider-failures
    status: covered
    source: bounded LiveKit room, token, connection, webhook, fallback, and one-time media outcome telemetry
    alerts:
      - CallProviderFailure
      - CallMediaFailure

  - id: call-authorization-denials
    status: covered
    source: menorah_security_events_total event=call_authorization_denied
    alerts:
      - CallAuthorizationDenialSpike

  - id: http-401-rate
    status: covered
    source: menorah_http_responses_total with fixed service, route-family, and status inventories
    alerts:
      - ElevatedHttp401Rate

  - id: http-403-rate
    status: covered
    source: menorah_http_responses_total with fixed service, route-family, and status inventories
    alerts:
      - ElevatedHttp403Rate

  - id: http-429-rate
    status: covered
    source: menorah_http_responses_total with fixed service, route-family, and status inventories
    alerts:
      - ElevatedHttp429Rate

  - id: http-500-rate
    status: covered
    source: menorah_http_responses_total with fixed service, route-family, and status inventories
    alerts:
      - ElevatedHttp500Rate

  - id: monitoring-stack-health
    status: covered
    source: Prometheus self-scrapes and exporter scrape health
    alerts:
      - LogCollectorDown
      - LokiDown
      - BlackboxExporterDown
      - AlertmanagerDown
      - PrometheusSelfScrapeFailed

p0_alerts:
  - alert: WorkerQueueBacklogHigh
    metric: menorah_queue_pending_jobs
    producer: backend/src/services/providerRevocationService.js
    rule: deploy/monitoring/alert-rules.yml
    test_fixture: queue payment email and call reliability signals fire from bounded producers
    severity: critical
    runbook: monitoring-alert-runbook.md#workerqueuebackloghigh
    live_evidence_requirement: Isolated staging backlog, retry, dead-letter, and stale-heartbeat firing/recovery evidence.
    owner_placeholder: worker-response-owner-tbd

  - alert: BackupJobFailed
    metric: menorah_backup_last_attempt_result
    producer: deploy/ubuntu/record-backup-result.sh
    rule: deploy/monitoring/alert-rules.yml
    test_fixture: latest backup failure fires immediately and a later success resolves it
    severity: critical
    runbook: monitoring-alert-runbook.md#backupjobfailed
    live_evidence_requirement: Isolated staging scheduled-backup failure and later-success recovery evidence.
    owner_placeholder: backup-response-owner-tbd

  - alert: PaymentProviderFailure
    metric: menorah_payment_operations_total
    producer: backend/src/services/razorpayPaymentSecurity.js
    rule: deploy/monitoring/alert-rules.yml
    test_fixture: queue payment email and call reliability signals fire from bounded producers
    severity: critical
    runbook: monitoring-alert-runbook.md#paymentproviderfailure
    live_evidence_requirement: Provider sandbox failure injection and recovery evidence without live-account mutation.
    owner_placeholder: payments-response-owner-tbd

  - alert: PaymentWebhookFailure
    metric: menorah_payment_webhook_events_total
