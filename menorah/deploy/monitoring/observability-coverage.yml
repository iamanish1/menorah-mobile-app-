    live_evidence_requirement: Signed sandbox webhook replay, relationship-mismatch, processing-failure, and recovery evidence.
    owner_placeholder: payments-response-owner-tbd

  - alert: EmailDispatchFailed
    metric: menorah_email_dispatch_total
