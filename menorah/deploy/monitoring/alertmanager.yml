global:
  resolve_timeout: 5m

# This source-controlled receiver intentionally has no delivery integration.
# Production notification credentials and destinations are an INFRASTRUCTURE
# ACTION and must be injected through an operator-controlled config overlay.
route:
  receiver: unconfigured-destination
  group_by:
    - alertname
    - service
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: unconfigured-destination

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - service
