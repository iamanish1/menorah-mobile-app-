global:
  resolve_timeout: 1m

route:
  receiver: local-sink
  group_by:
    - alertname
    - service
    - severity
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 30m

receivers:
  - name: local-sink
    webhook_configs:
      - url: http://alert-sink:9099/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - service
