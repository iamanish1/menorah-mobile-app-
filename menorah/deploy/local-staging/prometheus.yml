global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local-staging
    stack: menorah-local-staging

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: blackbox-http-internal
    metrics_path: /probe
    params:
      module:
        - http_success
    static_configs:
      - targets:
          - http://api-ios:8080/health/ready
        labels:
          component: api
          service: api-ios
          probe_module: http_ready
      - targets:
          - http://api-android:8080/health/ready
        labels:
          component: api
          service: api-android
          probe_module: http_ready
      - targets:
          - http://api-web:8080/health/ready
        labels:
          component: api
          service: api-web
          probe_module: http_ready
      - targets:
          - http://api-admin:8080/health/ready
        labels:
          component: api
          service: api-admin
          probe_module: http_ready
      - targets:
          - http://worker:8080/health/ready
        labels:
          component: worker
          service: worker
          probe_module: http_ready
      - targets:
          - http://user-web-app:3002/
        labels:
          component: frontend
          service: landing-page
          probe_module: http_success
      - targets:
          - http://user-web-app:3002/
        labels:
          component: frontend
          service: user-web-app
          probe_module: http_success
      - targets:
          - http://web-app:3001/
        labels:
          component: frontend
          service: counsellor-web
          probe_module: http_success
      - targets:
          - http://admin-panel:3003/
        labels:
          component: frontend
          service: admin-panel
          probe_module: http_success
    relabel_configs:
      - source_labels:
          - probe_module
        target_label: __param_module
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tcp-internal
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    static_configs:
      - targets:
          - livekit:7880
        labels:
          component: calls
          service: livekit
      - targets:
          - mongo-primary:27017
        labels:
          component: datastore
          service: mongodb
      - targets:
          - redis:6379
        labels:
          component: datastore
          service: redis
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: security-events
    metrics_path: /metrics/security
    static_configs:
      - targets:
          - api-ios:8080
          - api-android:8080
          - api-web:8080
          - api-admin:8080
          - worker:8080

  - job_name: local-alert-fixture
    metrics_path: /metrics
    static_configs:
      - targets:
          - alert-fixture:9101

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  - job_name: mongodb-exporter
    static_configs:
      - targets:
          - mongodb-exporter:9216

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
