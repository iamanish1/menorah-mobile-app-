  alert-sink:
    image: node:22-alpine@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2
    restart: unless-stopped
    user: "65534:65534"
    command:
      - node
      - -e
      - |
        const http = require("http");
        http.createServer((request, response) => {
          if (request.url === "/healthz") {
            response.writeHead(200).end("ok");
            return;
          }
          if (request.method !== "POST" || request.url !== "/alerts") {
            response.writeHead(404).end();
            return;
          }
          let size = 0;
          request.on("data", (chunk) => {
            size += chunk.length;
            if (size > 1024 * 1024) {
              request.destroy();
            }
          });
          request.on("end", () => {
            response.writeHead(200).end("accepted");
          });
        }).listen(9099, "0.0.0.0");
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
