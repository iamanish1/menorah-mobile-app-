name: menorah-local-staging

# This model is intentionally self-contained and local-only. Invoke it through
# the local-staging launcher, which supplies the generated synthetic env file
# with --env-file. The same file exports this absolute path for the few
# credential-bootstrap containers that must consume the complete identity set.
x-generated-env-file: &generated-env-file
  "${MENORAH_LOCAL_STAGING_ENV_FILE:?Generate the local staging env file first}"

x-backend-environment: &backend-environment
  NODE_ENV: production
  DEPLOYMENT_ENVIRONMENT: staging
  MENORAH_LOCAL_STAGING_ENVIRONMENT_ID: "${MENORAH_LOCAL_STAGING_ENVIRONMENT_ID:?Generated environment identity required}"
  MENORAH_LOCAL_STAGING_HTTPS_PORT: "${MENORAH_LOCAL_STAGING_HTTPS_PORT:?Generated local HTTPS port required}"
  MENORAH_STAGING_ALLOWED_HOSTS: "${MENORAH_STAGING_ALLOWED_HOSTS:?Required in generated local staging env}"
  MENORAH_STAGING_EMAIL_DOMAIN: "${MENORAH_STAGING_EMAIL_DOMAIN:?Required in generated local staging env}"
  SERVICE_RUNTIME: home
  PORT: "8080"
  ROOT_DOMAIN: "${ROOT_DOMAIN:?Required in generated local staging env}"
  WWW_DOMAIN: "${WWW_DOMAIN:?Required in generated local staging env}"
  APP_DOMAIN: "${APP_DOMAIN:?Required in generated local staging env}"
  ADMIN_DOMAIN: "${ADMIN_DOMAIN:?Required in generated local staging env}"
  COUNSELLOR_DOMAIN: "${COUNSELLOR_DOMAIN:?Required in generated local staging env}"
  API_IOS_DOMAIN: "${API_IOS_DOMAIN:?Required in generated local staging env}"
  API_ANDROID_DOMAIN: "${API_ANDROID_DOMAIN:?Required in generated local staging env}"
  API_WEB_DOMAIN: "${API_WEB_DOMAIN:?Required in generated local staging env}"
  API_ADMIN_DOMAIN: "${API_ADMIN_DOMAIN:?Required in generated local staging env}"
  CALLS_DOMAIN: "${CALLS_DOMAIN:?Required in generated local staging env}"
  FRONTEND_API_WEB_URL: "${FRONTEND_API_WEB_URL:?Required in generated local staging env}"
  FRONTEND_API_ADMIN_URL: "${FRONTEND_API_ADMIN_URL:?Required in generated local staging env}"
  FRONTEND_COUNSELLOR_URL: "${FRONTEND_COUNSELLOR_URL:?Required in generated local staging env}"
  FRONTEND_SOCKET_WEB_URL: "${FRONTEND_SOCKET_WEB_URL:?Required in generated local staging env}"
  LIVEKIT_URL: "${LIVEKIT_URL:?Required in generated local staging env}"
  LIVEKIT_API_URL: "${LIVEKIT_API_URL:?Required in generated local staging env}"
  LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?Required in generated local staging env}"
  LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?Required in generated local staging env}"
  CALLING_REGION_MODE: "${CALLING_REGION_MODE:-local}"
  LIVEKIT_BLOCKED_COUNTRIES: ""
  CALL_JOIN_EARLY_MINUTES: "${CALL_JOIN_EARLY_MINUTES:-15}"
  CALL_JOIN_LATE_GRACE_MINUTES: "${CALL_JOIN_LATE_GRACE_MINUTES:-15}"
  VIDEO_MEET_TICKET_TTL_SECONDS: "${VIDEO_MEET_TICKET_TTL_SECONDS:-120}"
  BLOCKED_COUNTRY_CALL_PROVIDER: livekit
  BLOCK_LIVEKIT_FOR_UAE: "false"
  BLOCK_LIVEKIT_FOR_UNKNOWN_REGION: "false"
  UAE_CALL_PROVIDER: livekit
  UAE_CALLING_ENABLED: "false"
  VSEE_ENABLED: "false"
  VSEE_INTEGRATION_MODE: external_link
  DOXY_ENABLED: "false"
  ZOOM_ENABLED: "false"
  GOOGLE_MEET_ENABLED: "false"
  TEAMS_ENABLED: "false"
  MONGODB_URI: "${MONGODB_URI:?Required in generated local staging env}"
  MONGODB_REPLICA_SET_NAME: menorah-rs
  MONGODB_READ_PREFERENCE: primaryPreferred
  MONGODB_RETRY_WRITES: "true"
  REDIS_URL: "${REDIS_URL:?Required in generated local staging env}"
  SERVER_USAGE_LABEL: Local synthetic staging
  SERVER_USAGE_PATH: ""
  JWT_SECRET: "${JWT_SECRET:?Required in generated local staging env}"
  JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Required in generated local staging env}"
  JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
  JWT_REFRESH_EXPIRES_IN: "${JWT_REFRESH_EXPIRES_IN:-30d}"
  ADMIN_JWT_EXPIRES_IN: "${ADMIN_JWT_EXPIRES_IN:-30m}"
  ADMIN_MFA_REQUIRED: "true"
  TRUST_PROXY: 10.254.240.10
  GOOGLE_WEB_CLIENT_ID: "${GOOGLE_WEB_CLIENT_ID:-}"
  GOOGLE_IOS_CLIENT_ID: "${GOOGLE_IOS_CLIENT_ID:-}"
  GOOGLE_ANDROID_CLIENT_ID: "${GOOGLE_ANDROID_CLIENT_ID:-}"
  APPLE_IOS_BUNDLE_ID: "${APPLE_IOS_BUNDLE_ID:-com.menorah.health.localstaging}"
  APPLE_WEB_SERVICE_ID: "${APPLE_WEB_SERVICE_ID:-}"
  ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:?Required in generated local staging env}"
  WEB_SESSION_ORIGINS: "${WEB_SESSION_ORIGINS:?Required in generated local staging env}"
  ENABLE_SOCKET_IO: "${ENABLE_SOCKET_IO:-true}"
  ENABLE_SOCKET_ADAPTER: "${ENABLE_SOCKET_ADAPTER:-true}"
  WORKER_MODE: "${WORKER_MODE:-active}"
  ENABLE_ARTICLE_SCHEDULER: "false"
  ENABLE_SOCIAL_SCHEDULER: "false"
  ENABLE_BACKUP_JOBS: "false"
  ENABLE_EMAIL_JOBS: "false"
  ENABLE_NOTIFICATION_JOBS: "false"
  MENORAH_BACKUP_ROOT: /backups
  BACKUP_AUTOMATION_ENABLED: "false"
  BACKUP_EXPECT_RAID: "false"
  BACKUP_RAID_DEVICE: ""
  BACKUP_MAX_AGE_HOURS: "${BACKUP_MAX_AGE_HOURS:-24}"
  BACKUP_RESTORE_TEST_MAX_AGE_HOURS: "${BACKUP_RESTORE_TEST_MAX_AGE_HOURS:-24}"
  BACKUP_DISK_USAGE_MAX_PERCENT: "${BACKUP_DISK_USAGE_MAX_PERCENT:-80}"
  BACKUP_COLD_STORAGE_LABEL: Local Docker volume
  SIX_HOURLY_RETENTION_DAYS: "${SIX_HOURLY_RETENTION_DAYS:-7}"
  DAILY_RETENTION_DAYS: "${DAILY_RETENTION_DAYS:-30}"
  WEEKLY_RETENTION_DAYS: "${WEEKLY_RETENTION_DAYS:-84}"
  MONTHLY_RETENTION_DAYS: "${MONTHLY_RETENTION_DAYS:-366}"
  RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:?Synthetic Razorpay test key required}"
  NEXT_PUBLIC_RAZORPAY_KEY_ID: "${NEXT_PUBLIC_RAZORPAY_KEY_ID:?Synthetic Razorpay test key required}"
  RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:?Synthetic Razorpay secret required}"
  RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET:?Synthetic Razorpay webhook secret required}"
  RAZORPAY_WEBHOOK_SECRET_PREVIOUS: "${RAZORPAY_WEBHOOK_SECRET_PREVIOUS:-}"
  RAZORPAY_X_KEY_ID: "${RAZORPAY_X_KEY_ID:-}"
  RAZORPAY_X_KEY_SECRET: "${RAZORPAY_X_KEY_SECRET:-}"
  RAZORPAY_PAYOUT_ACCOUNT_NUMBER: "${RAZORPAY_PAYOUT_ACCOUNT_NUMBER:-}"
  RAZORPAY_X_WEBHOOK_SECRET: "${RAZORPAY_X_WEBHOOK_SECRET:?Synthetic payout webhook secret required}"
  BOOKING_PAYMENTS_ENABLED: "false"
  PAYOUTS_ENABLED: "false"
  PAYMENT_WEBHOOK_MAX_PROCESSING_ATTEMPTS: "${PAYMENT_WEBHOOK_MAX_PROCESSING_ATTEMPTS:-5}"
  SUBSCRIPTION_PAYMENTS_ENABLED: "false"
  BOOKING_SERVICE_CATALOG_JSON: "${BOOKING_SERVICE_CATALOG_JSON:?Synthetic booking catalog required}"
  CHECKOUT_RETURN_URL: "${CHECKOUT_RETURN_URL:?Required in generated local staging env}"
  RESEND_API_KEY: "${RESEND_API_KEY:?Synthetic Resend test key required}"
  RESEND_API_URL: "${RESEND_API_URL:?Internal local mail capture URL required}"
  RESEND_WEBHOOK_SECRET: "${RESEND_WEBHOOK_SECRET:?Synthetic Resend webhook secret required}"
  EMAIL_FROM: "${EMAIL_FROM:?Synthetic staging sender required}"
  CONTACT_TO_EMAIL: "${CONTACT_TO_EMAIL:?Synthetic staging contact required}"
  PASSWORD_RESET_BASE_URL: "${PASSWORD_RESET_BASE_URL:?Required in generated local staging env}"
  LUXAND_API_TOKEN: ""
  OPENAI_API_KEY: ""
  CLOUDINARY_CLOUD_NAME: ""
  CLOUDINARY_API_KEY: ""
  CLOUDINARY_API_SECRET: ""
  MEDIA_STORAGE_BACKEND: local
  MEDIA_PUBLIC_BASE_URL: "${MEDIA_PUBLIC_BASE_URL:?Required in generated local staging env}"
  UPLOAD_PATH: /app/uploads
  DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:?Synthetic data encryption key required}"
  AUDIT_LOG_SIGNING_KEY: "${AUDIT_LOG_SIGNING_KEY:?Synthetic audit signing key required}"
  SECURITY_AUDIT_PENDING_MAX: "${SECURITY_AUDIT_PENDING_MAX:-1024}"
  MAX_PAYOUT_AMOUNT_PAISE: "${MAX_PAYOUT_AMOUNT_PAISE:?Required in generated local staging env}"
  KYC_CONSENT_VERSION: "${KYC_CONSENT_VERSION:?Required in generated local staging env}"
  KYC_RETENTION_DAYS: "${KYC_RETENTION_DAYS:?Required in generated local staging env}"
  PRIVACY_NOTICE_VERSION: "${PRIVACY_NOTICE_VERSION:?Required in generated local staging env}"
  ADMIN_ROLE_GRANTS_JSON: "${ADMIN_ROLE_GRANTS_JSON:?Synthetic admin role grants required}"
  PRIVACY_RETENTION_EXECUTION_ENABLED: "false"
  PRIVACY_ADMIN_PERMISSION_GRANTS_JSON: "${PRIVACY_ADMIN_PERMISSION_GRANTS_JSON:?Synthetic privacy grants required}"
  PRIVACY_RETENTION_POLICY_JSON: "${PRIVACY_RETENTION_POLICY_JSON:?Synthetic privacy policy required}"
  PRIVACY_RETENTION_BATCH_SIZE: "${PRIVACY_RETENTION_BATCH_SIZE:-25}"
  COUNSELLOR_ONBOARDING_CONSENT_VERSION: "${COUNSELLOR_ONBOARDING_CONSENT_VERSION:?Required in generated local staging env}"
  COUNSELLOR_CREDENTIAL_POLICY_VERSION: "${COUNSELLOR_CREDENTIAL_POLICY_VERSION:?Required in generated local staging env}"
  COUNSELLOR_ONBOARDING_NOTICE_URL: "${COUNSELLOR_ONBOARDING_NOTICE_URL:?Required in generated local staging env}"

x-app-security: &app-security
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: 1g
  cpus: "1.00"
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777

x-backend-build: &backend-build
  image: menorah-local-staging/backend:runtime

services:
  mongo-primary:
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    restart: unless-stopped
    entrypoint:
      - bash
      - -euc
      - |
        install -m 400 /mongo-keyfile-source/mongo-keyfile /data/db/mongo-keyfile
        exec docker-entrypoint.sh mongod \
          --bind_ip_all \
          --replSet menorah-rs \
          --auth \
          --keyFile /data/db/mongo-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:?Generated Mongo root user required}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Generated Mongo root password required}"
      MONGO_INITDB_DATABASE: menorah
      MONGO_ROOT_USER: "${MONGO_ROOT_USER:?Generated Mongo root user required}"
      MONGO_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Generated Mongo root password required}"
    volumes:
      - type: volume
        source: mongo
        target: /data/db
      - type: bind
        source: "${MENORAH_LOCAL_STAGING_MONGO_KEYFILE:?Generate the local Mongo keyfile first}"
        target: /mongo-keyfile-source/mongo-keyfile
        read_only: true
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1 --authenticationDatabase admin
          --username "$$MONGO_ROOT_USER" --password "$$MONGO_ROOT_PASSWORD"
          --eval "quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongo-replica-init:
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    restart: "no"
    env_file:
      - *generated-env-file
    command:
      - bash
      - -euc
      - |
        mongosh --nodb --quiet --eval '
          const admin = connect(
            "mongodb://mongo-primary:27017/admin?authSource=admin",
            process.env.MONGO_ROOT_USER,
            process.env.MONGO_ROOT_PASSWORD
          );
          try {
            admin.adminCommand({ replSetGetStatus: 1 });
          } catch (error) {
            if (error.code !== 94 && error.codeName !== "NotYetInitialized") {
              throw error;
            }
            const initiated = admin.adminCommand({
              replSetInitiate: {
                _id: "menorah-rs",
                members: [{ _id: 0, host: "mongo-primary:27017" }],
              },
            });
            if (initiated.ok !== 1) throw new Error(`Replica initiation failed: $${tojson(initiated)}`);
          }
        '

        ready=false
        for attempt in $$(seq 1 60); do
          if mongosh --nodb --quiet --eval '
            const admin = connect(
              "mongodb://mongo-primary:27017/admin?authSource=admin",
              process.env.MONGO_ROOT_USER,
              process.env.MONGO_ROOT_PASSWORD
            );
            quit(admin.hello().isWritablePrimary ? 0 : 1);
          '; then
            ready=true
            break
          fi
          sleep 2
        done
        test "$$ready" = true

        mongosh --nodb --quiet --eval '
          const admin = connect(
            "mongodb://mongo-primary:27017/admin?authSource=admin",
            process.env.MONGO_ROOT_USER,
            process.env.MONGO_ROOT_PASSWORD
          );
          const identities = [
            {
              user: process.env.MONGO_APP_USER,
              pwd: process.env.MONGO_APP_PASSWORD,
              roles: [{ role: "readWrite", db: "menorah" }],
            },
            {
              user: process.env.MONGO_BACKUP_USER,
              pwd: process.env.MONGO_BACKUP_PASSWORD,
              roles: [{ role: "backup", db: "admin" }],
            },
            {
              user: process.env.MONGO_RESTORE_USER,
              pwd: process.env.MONGO_RESTORE_PASSWORD,
              roles: [
                { role: "readWrite", db: "menorah" },
                { role: "dbAdmin", db: "menorah" },
              ],
            },
            {
              user: process.env.MONGO_MONITOR_USER,
              pwd: process.env.MONGO_MONITOR_PASSWORD,
              roles: [
                { role: "clusterMonitor", db: "admin" },
                { role: "read", db: "local" },
              ],
            },
          ];
          const normalize = (roles) => roles
            .map(({ role, db }) => `$${role}@$${db}`)
            .sort()
            .join(",");
          for (const identity of identities) {
            if (!identity.user || !identity.pwd) throw new Error("Managed Mongo identity is incomplete");
            const existing = admin.getUser(identity.user);
            if (!existing) {
              admin.createUser(identity);
            } else if (normalize(existing.roles) !== normalize(identity.roles)) {
              throw new Error(`Unexpected roles for managed Mongo user $${identity.user}`);
            }
            const credential = connect(
              "mongodb://mongo-primary:27017/admin?authSource=admin",
              identity.user,
              identity.pwd
            );
            if (credential.runCommand({ connectionStatus: 1 }).ok !== 1) {
              throw new Error(`Credential verification failed for $${identity.user}`);
            }
          }
        '
    networks:
      - data
    depends_on:
      mongo-primary:
        condition: service_healthy

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    entrypoint:
      - sh
      - -euc
      - |
        umask 077
        printf 'appendonly yes\nrequirepass %s\n' "$$REDIS_PASSWORD" >/run/redis/redis.conf
        chmod 0400 /run/redis/redis.conf
        exec redis-server /run/redis/redis.conf
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Generated Redis password required}"
    read_only: true
    user: "999:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    volumes:
      - type: volume
        source: redis
        target: /data
    tmpfs:
      - /run/redis:rw,noexec,nosuid,nodev,size=1m,mode=700,uid=999,gid=1000
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mail-capture:
    image: menorah-local-staging/mail-capture:runtime
    build:
      context: ./mail-capture
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.25"
    environment:
      NODE_ENV: production
      MAIL_CAPTURE_PORT: "8025"
      MAIL_CAPTURE_API_KEY: "${RESEND_API_KEY:?Generated local mail capture key required}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:8025/health")
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api-ios:
    <<: [*app-security, *backend-build]
    command: ["node", "src/services/api-ios/server.js"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: api-ios
      APPLE_SIGN_IN_ENABLED: "false"
      MONGODB_BACKUP_URI: ""
      MONGODB_RESTORE_TEST_URI: ""
      BACKUP_ENCRYPTION_PASSWORD: ""
    ports:
      - "127.0.0.1:28080:8080"
    volumes:
      - type: volume
        source: uploads
        target: /app/uploads
    networks:
      - app
      - data
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mail-capture:
        condition: service_healthy

  api-android:
    <<: [*app-security, *backend-build]
    command: ["node", "src/services/api-android/server.js"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: api-android
      APPLE_SIGN_IN_ENABLED: "false"
      MONGODB_BACKUP_URI: ""
      MONGODB_RESTORE_TEST_URI: ""
      BACKUP_ENCRYPTION_PASSWORD: ""
    ports:
      - "127.0.0.1:28081:8080"
    volumes:
      - type: volume
        source: uploads
        target: /app/uploads
    networks:
      - app
      - data
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mail-capture:
        condition: service_healthy

  api-web:
    <<: [*app-security, *backend-build]
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["node", "src/services/api-web/server.js"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: api-web
      APPLE_SIGN_IN_ENABLED: "false"
      MONGODB_BACKUP_URI: ""
      MONGODB_RESTORE_TEST_URI: ""
      BACKUP_ENCRYPTION_PASSWORD: ""
    ports:
      - "127.0.0.1:28082:8080"
    volumes:
      - type: volume
        source: uploads
        target: /app/uploads
    networks:
      - app
      - data
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mail-capture:
        condition: service_healthy

  api-admin:
    <<: [*app-security, *backend-build]
    command: ["node", "src/services/api-admin/server.js"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: api-admin
      APPLE_SIGN_IN_ENABLED: "false"
      ENABLE_SOCKET_IO: "false"
      ENABLE_SOCKET_ADAPTER: "false"
      MONGODB_BACKUP_URI: ""
      MONGODB_RESTORE_TEST_URI: ""
      BACKUP_ENCRYPTION_PASSWORD: ""
    ports:
      - "127.0.0.1:28083:8080"
    volumes:
      - type: volume
        source: uploads
        target: /app/uploads
      - type: volume
        source: backups
        target: /backups
        read_only: true
    networks:
      - app
      - data
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mail-capture:
        condition: service_healthy

  worker:
    <<: [*app-security, *backend-build]
    command: ["node", "src/services/worker/worker.js"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: worker
      APPLE_SIGN_IN_ENABLED: "false"
      WORKER_MODE: active
      MONGODB_BACKUP_URI: ""
      MONGODB_RESTORE_TEST_URI: ""
      BACKUP_ENCRYPTION_PASSWORD: ""
    ports:
      - "127.0.0.1:28084:8080"
    volumes:
      - type: volume
        source: uploads
        target: /app/uploads
      - type: volume
        source: backups
        target: /backups
    networks:
      - app
      - data
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mail-capture:
        condition: service_healthy

  migrate-local-staging:
    <<: [*app-security, *backend-build]
    profiles: ["seed"]
    restart: "no"
    command: ["node", "src/database/migrate.js"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: migrate-local-staging
      APPLE_SIGN_IN_ENABLED: "false"
      MONGODB_BACKUP_URI: ""
      MONGODB_RESTORE_TEST_URI: ""
      BACKUP_ENCRYPTION_PASSWORD: ""
    networks:
      - data
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully

  seed-local-staging:
    <<: [*app-security, *backend-build]
    profiles: ["seed"]
    restart: "no"
    command: ["node", "src/database/seed-local-staging.js"]
    env_file:
      - *generated-env-file
    networks:
      - data
    depends_on:
      migrate-local-staging:
        condition: service_completed_successfully

  user-web-app:
    <<: *app-security
    image: menorah-local-staging/user-web-app:runtime
    build:
      context: ../../user-web-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${FRONTEND_API_WEB_URL:?Required in generated local staging env}"
        NEXT_PUBLIC_SOCKET_URL: "${FRONTEND_SOCKET_WEB_URL:?Required in generated local staging env}"
        NEXT_PUBLIC_RAZORPAY_KEY_ID: "${NEXT_PUBLIC_RAZORPAY_KEY_ID:?Synthetic Razorpay test key required}"
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
        NEXT_PUBLIC_JITSI_DOMAIN: "${CALLS_DOMAIN:?Required in generated local staging env}"
        NEXT_PUBLIC_CALLS_URL: "${LIVEKIT_URL:?Required in generated local staging env}"
        NEXT_PUBLIC_WEB_BASE_URL: "https://${APP_DOMAIN:?Required in generated local staging env}:${MENORAH_LOCAL_STAGING_HTTPS_PORT:?Required in generated local staging env}"
