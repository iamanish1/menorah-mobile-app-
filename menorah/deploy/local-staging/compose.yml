  mongo-restore-replica-init:
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    profiles: ["recovery"]
    restart: "no"
    command:
      - bash
      - -euc
      - |
        mongosh --nodb --quiet --eval '
          const admin = connect(
            "mongodb://mongo-restore:27017/admin"
          );
          try {
            admin.adminCommand({ replSetGetStatus: 1 });
          } catch (error) {
            if (error.code !== 94 && error.codeName !== "NotYetInitialized") throw error;
            const initiated = admin.adminCommand({
              replSetInitiate: {
                _id: "menorah-restore-rs",
                members: [{ _id: 0, host: "mongo-restore:27017" }],
              },
            });
            if (initiated.ok !== 1) throw new Error(`Restore replica initiation failed: $${tojson(initiated)}`);
          }
        '
        ready=false
        for attempt in $$(seq 1 60); do
          if mongosh --nodb --quiet --eval '
            const admin = connect("mongodb://mongo-restore:27017/admin");
            quit(admin.hello().isWritablePrimary ? 0 : 1);
          '; then
            ready=true
            break
          fi
          sleep 2
        done
        test "$$ready" = true
    networks:
      - restore
    depends_on:
      mongo-restore:
        condition: service_healthy

