    entrypoint: ["/bin/sh", "/scripts/restore-local.sh"]
    environment:
      MONGODB_RESTORE_TEST_URI: "${MONGODB_RESTORE_TEST_URI:?Generated Mongo restore URI required}"
      MENORAH_LOCAL_STAGING_ENVIRONMENT_ID: "${MENORAH_LOCAL_STAGING_ENVIRONMENT_ID:?Generated environment identity required}"
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:?Generated Compose project name required}"
      MENORAH_RUNTIME_CANDIDATE_SHA: "${MENORAH_RUNTIME_CANDIDATE_SHA:?Generated runtime candidate SHA required}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./restore-local.sh
        target: /scripts/restore-local.sh
        read_only: true
      - type: volume
        source: retrieval
        target: /retrieval
        read_only: true
      - type: volume
        source: restore-media
        target: /restore-media
    secrets:
      - source: backup-encryption-password
        target: backup-encryption-password
        mode: 0400
      - source: backup-integrity-hmac-key
        target: backup-integrity-hmac-key
        mode: 0400
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    networks:
      - restore
    depends_on:
      mongo-restore-replica-init:
        condition: service_completed_successfully

configs:
  blackbox:
    content: |
      modules:
        http_success:
          prober: http
          timeout: 10s
          http:
            method: GET
            valid_status_codes: [200]
            follow_redirects: true
            preferred_ip_protocol: ip4
            ip_protocol_fallback: true
        http_ready:
          prober: http
          timeout: 10s
          http:
            method: GET
            valid_status_codes: [200]
            follow_redirects: false
            preferred_ip_protocol: ip4
            ip_protocol_fallback: true
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
            ip_protocol_fallback: true
  loki:
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
      common:
        path_prefix: /loki
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
      schema_config:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        allow_structured_metadata: true
      analytics:
        reporting_enabled: false

secrets:
  backup-encryption-password:
    file: "${MENORAH_LOCAL_STAGING_BACKUP_PASSWORD_FILE:?Generate the local backup password file first}"
  backup-integrity-hmac-key:
    file: "${MENORAH_LOCAL_STAGING_BACKUP_HMAC_FILE:?Generate the local backup HMAC file first}"

networks:
  app:
    name: menorah-local-staging
    internal: true
    ipam:
      config:
        - subnet: 10.254.240.0/24
  data:
    name: menorah-local-staging-data
    internal: true
    ipam:
      config:
        - subnet: 10.254.241.0/24
  monitoring:
    name: menorah-local-staging-monitoring
    internal: true
    ipam:
      config:
        - subnet: 10.254.242.0/24
  restore:
    name: menorah-local-staging-restore
    internal: true
    ipam:
      config:
        - subnet: 10.254.243.0/24

volumes:
  mongo:
    name: menorah-local-staging-mongo
  redis:
    name: menorah-local-staging-redis
  uploads:
    name: menorah-local-staging-uploads
  backups:
    name: menorah-local-staging-backups
  retrieval:
    name: menorah-local-staging-retrieval
  prometheus:
    name: menorah-local-staging-prometheus
  alertmanager:
    name: menorah-local-staging-alertmanager
  loki:
    name: menorah-local-staging-loki
  alloy:
    name: menorah-local-staging-alloy
  restore-mongodb:
    name: menorah-local-staging-restore-mongodb
  restore-media:
    name: menorah-local-staging-restore-media
  logs:
    name: menorah-local-staging-logs
