        condition: service_started

  worker:
    <<: *api-security
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "src/services/worker/worker.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: worker
      APPLE_SIGN_IN_ENABLED: ${APPLE_SIGN_IN_ENABLED:?APPLE_SIGN_IN_ENABLED is required}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      WORKER_MODE: ${WORKER_MODE:-active}
      MONGODB_BACKUP_URI: ""
      MONGODB_RESTORE_TEST_URI: ""
      BACKUP_ENCRYPTION_PASSWORD: ""
    ports:
      - "${WORKER_LOCAL_PORT:-127.0.0.1:18090}:8080"
    volumes:
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/uploads:/app/uploads
    networks:
      - local_probe_net
      - app_net
      - db_net
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  mongo-primary:
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    restart: unless-stopped
    entrypoint:
      - bash
      - -lc
      - |
        install -m 400 /mongo-keyfile-source/mongo-keyfile /data/db/mongo-keyfile
        exec docker-entrypoint.sh mongod --config /etc/mongod.conf --keyFile /data/db/mongo-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      MONGO_APP_USER: ${MONGO_APP_USER:-}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-}
      MONGO_BACKUP_USER: ${MONGO_BACKUP_USER:-}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:-}
      MONGO_RESTORE_USER: ${MONGO_RESTORE_USER:-}
      MONGO_RESTORE_PASSWORD: ${MONGO_RESTORE_PASSWORD:-}
      MONGO_MONITOR_USER: ${MONGO_MONITOR_USER:-}
      MONGO_MONITOR_PASSWORD: ${MONGO_MONITOR_PASSWORD:-}
    volumes:
      - ./mongo/mongod-primary.conf:/etc/mongod.conf:ro
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/mongo/primary:/data/db
      - ${MONGO_KEYFILE_PATH:-/opt/menorah/secrets/mongo-keyfile}:/mongo-keyfile-source/mongo-keyfile:ro
      - ./mongo/create-users.js:/docker-entrypoint-initdb.d/20-create-users.js:ro
    networks:
      - db_net

  mongo-replica-init:
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    restart: "no"
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      MONGODB_REPLICA_SET_NAME: ${MONGODB_REPLICA_SET_NAME:-menorah-rs}
      MONGO_PRIMARY_HOST: ${MONGO_PRIMARY_HOST:-mongo-primary:27017}
    command:
      - bash
      - -lc
      - |
        until mongosh --nodb --quiet --eval '
          db = connect("mongodb://mongo-primary:27017/admin?authSource=admin", process.env.MONGO_ROOT_USER, process.env.MONGO_ROOT_PASSWORD);
          quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1);
        ' >/dev/null; do
          echo "Waiting for mongo-primary auth..."
          sleep 2
        done

        mongosh --nodb --quiet --eval '
          db = connect("mongodb://mongo-primary:27017/admin?authSource=admin", process.env.MONGO_ROOT_USER, process.env.MONGO_ROOT_PASSWORD);
          try {
            printjson(rs.status());
          } catch (error) {
            printjson(rs.initiate({
              _id: process.env.MONGODB_REPLICA_SET_NAME || "menorah-rs",
              members: [{ _id: 0, host: process.env.MONGO_PRIMARY_HOST || "mongo-primary:27017" }],
            }));
          }
        '
    networks:
      - db_net
    depends_on:
      - mongo-primary

  mongo-restore-test:
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    profiles: ["restore-test"]
    restart: "no"
    command:
      - mongod
      - --bind_ip_all
      - --replSet
      - menorah-restore-rs
    volumes:
      - restore_test_data:/data/db
    networks:
      - restore_test_net

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/redis:/data
    networks:
      - db_net

  backup-runner:
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    profiles: ["backup-job"]
    restart: "no"
    environment:
      MONGODB_BACKUP_URI: ${MONGODB_BACKUP_URI:-}
      BACKUP_ROOT: /backups/six-hourly
    volumes:
      - ./backup:/scripts:ro
      - ${MENORAH_BACKUP_ROOT:-/opt/menorah/backups}:/backups
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/uploads:/uploads:ro
    command: ["bash", "-lc", "echo 'Use the host systemd timers and deploy/ubuntu/backup-now.sh.' >&2; exit 64"]
    networks:
      - db_net
    depends_on:
      mongo-primary:
        condition: service_started

  production-restore-runner:
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    profiles: ["production-restore"]
    restart: "no"
    environment:
      MONGODB_PRODUCTION_RESTORE_URI: ${MONGODB_PRODUCTION_RESTORE_URI:-}
    command: ["bash", "-lc", "echo 'Use deploy/ubuntu/restore-latest-backup.sh production.' >&2; exit 64"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    networks:
      - db_net
    depends_on:
      mongo-primary:
        condition: service_started

  media-verifier:
    <<: *api-security
    build:
      context: ../backend
      dockerfile: Dockerfile
    profiles: ["backup-job", "restore-test", "production-restore"]
    restart: "no"
    command: ["node", "-e", "process.stderr.write('Use the signed backup and restore scripts.\\n'); process.exit(64)"]
    environment:
      MEDIA_VERIFY_MONGODB_URI: ""
    volumes:
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}:/media-data:ro
      - ${MENORAH_BACKUP_ROOT:-/opt/menorah/backups}:/backups:ro
    networks:
      - db_net
      - restore_test_net

  restore-test-runner:
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    profiles: ["restore-test"]
    restart: "no"
    environment:
      MONGODB_RESTORE_TEST_URI: ${MONGODB_RESTORE_TEST_URI:-}
    volumes:
      - ./backup:/scripts:ro
    command: ["bash", "-lc", "echo 'Use deploy/ubuntu/restore-latest-backup.sh.' >&2; exit 64"]
    networks:
      - restore_test_net

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./monitoring/alert-rules.test.yml:/etc/prometheus/alert-rules.test.yml:ro
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/prometheus:/prometheus
    networks:
      - monitoring_net
      - app_net
    depends_on:
      - alertmanager
      - blackbox-exporter
      - mongodb-exporter
      - redis-exporter
      - node-exporter

  alertmanager:
    image: prom/alertmanager:v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ${ALERTMANAGER_CONFIG_FILE:-./monitoring/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/alertmanager:/alertmanager
    ports:
      - "${ALERTMANAGER_LOCAL_PORT:-127.0.0.1:18102}:9093"
    networks:
      - monitoring_net
      - public_net

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
      - --log.prober=warn
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    networks:
      - monitoring_net
      - app_net
      - db_net
      - public_net

  mongodb-exporter:
    image: percona/mongodb_exporter:0.51.0@sha256:852b90b9f38ab489762b8a8b8c074ce852272c2495d725b922bdb5bc7d659e16
    restart: unless-stopped
    command:
      - --collector.diagnosticdata
      - --collector.replicasetstatus
      - --compatible-mode
      - --mongodb.global-conn-pool
      - --mongodb.connect-timeout-ms=5000
    environment:
      MONGODB_URI: ${MONGODB_MONITORING_URI:-}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring_net
      - db_net
    depends_on:
      mongo-primary:
        condition: service_started

  redis-exporter:
    image: oliver006/redis_exporter:v1.84.0@sha256:7ef8e9c26638158fa4e7ad60df8c7e53d1919986753d6c1d2d1876b6ec38d87b
    restart: unless-stopped
    environment:
      REDIS_ADDR: ${REDIS_MONITORING_URL:-redis://redis:6379}
      REDIS_EXPORTER_CONNECTION_TIMEOUT: 5s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring_net
      - db_net
    depends_on:
      redis:
        condition: service_started

  node-exporter:
    image: prom/node-exporter:v1.11.1@sha256:e9cff4fc67b1818f8c97adb115b9f12c9a54b533de86765d4a0effc01b357205
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|host|etc)($$|/)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/host:ro,rslave
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/monitoring-textfile:/textfile:ro
    networks:
      - monitoring_net

  backup-metrics:
    image: busybox:1.37.0-glibc@sha256:4279d9b47df4c1b02d80efd8d02cd59b3a8182c1e785a4ff3f6983bee19dc8b0
    restart: unless-stopped
    user: ${BACKUP_METRICS_RUN_AS:-65534:65534}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - while true; do if ! /bin/sh /scripts/export-backup-metrics.sh; then exit 1; fi; sleep 30; done
    environment:
      BACKUP_ROOT: /backups
      BACKUP_ATTEMPT_ROOT: /backup-attempts
      TEXTFILE_DIR: /textfile
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./monitoring/export-backup-metrics.sh:/scripts/export-backup-metrics.sh:ro
      - ${MENORAH_BACKUP_ROOT:-/opt/menorah/backups}:/backups:ro
      - ${MENORAH_DEPLOY_STATE_ROOT:-/opt/menorah/deploy-state}/backup-attempts:/backup-attempts:ro
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/monitoring-textfile:/textfile
    networks:
      - monitoring_net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /textfile/menorah-backup.prom &&
          modified=$$(stat -c %Y /textfile/menorah-backup.prom) &&
          age=$$(($$(date +%s) - modified)) &&
          test "$$age" -ge 0 && test "$$age" -le 600
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:11.3.0@sha256:a0f881232a6fb71a0554a47d0fe2203b6888fe77f4cefb7ea62bed7eb54e13c3
    restart: unless-stopped
    volumes:
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_LOCAL_PORT:-127.0.0.1:18100}:3000"
    networks:
      - monitoring_net

  uptime-kuma:
    image: louislam/uptime-kuma:1@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    restart: unless-stopped
    volumes:
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/uptime-kuma:/app/data
    ports:
      - "${UPTIME_KUMA_LOCAL_PORT:-127.0.0.1:18101}:3001"
    networks:
      - monitoring_net
      - app_net
      - public_net

  docker-metrics-gateway:
    image: node:22-alpine@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2
    restart: unless-stopped
    user: "0:0"
    command: ["node", "/app/docker-metrics-gateway.mjs"]
    environment:
      PORT: "2375"
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      DOCKER_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-menorah}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ./monitoring/docker-metrics-gateway.mjs:/app/docker-metrics-gateway.mjs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - docker_metrics_socket_net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:2375/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  docker-stats-exporter:
    image: node:22-alpine@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2
    restart: unless-stopped
    user: "1000:1000"
    command: ["node", "/app/docker-stats-exporter.mjs"]
    environment:
      DOCKER_API_URL: http://docker-metrics-gateway:2375
      PORT: "9250"
      COLLECTION_INTERVAL_MS: "30000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./monitoring/docker-stats-exporter.mjs:/app/docker-stats-exporter.mjs:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    networks:
      - monitoring_net
      - docker_metrics_socket_net
    depends_on:
      docker-metrics-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:9250/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  log-collector:
    image: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    restart: unless-stopped
    user: "0:0"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./logging/config.alloy:/etc/alloy/config.alloy:ro
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/alloy:/var/lib/alloy/data
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/logs:/var/log/menorah:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    networks:
      - monitoring_net
    depends_on:
      - loki

  loki:
    image: grafana/loki:3.7.3@sha256:70b9f699fc9bb868b62f1cfd4f787dfa50242f1fd92e6089787d5d7daea75fe8
    restart: unless-stopped
    user: "10001:10001"
    command: ["-config.file=/etc/loki/config.yml"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./logging/loki-config.yml:/etc/loki/config.yml:ro
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/loki:/loki
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    networks:
      - monitoring_net

networks:
  public_net:
  tunnel_ingress_net:
    internal: true
    ipam:
      config:
        - subnet: ${TUNNEL_INGRESS_SUBNET:?TUNNEL_INGRESS_SUBNET is required}
  local_probe_net:
  app_net:
    internal: true
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:?APP_NETWORK_SUBNET is required}
  db_net:
    internal: true
  monitoring_net:
    internal: true
  docker_metrics_socket_net:
    internal: true
  restore_test_net:
    internal: true
  mentle_internal:
    external: true

volumes:
  restore_test_data:
    name: ${COMPOSE_PROJECT_NAME:-menorah}-restore-test-data
