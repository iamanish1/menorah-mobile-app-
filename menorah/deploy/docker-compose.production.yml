    networks:
      - local_probe_net
      - app_net
      - db_net
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  api-web:
    <<: *api-security
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "src/services/api-web/server.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: api-web
      APPLE_SIGN_IN_ENABLED: "false"
      MONGODB_BACKUP_URI: ""
