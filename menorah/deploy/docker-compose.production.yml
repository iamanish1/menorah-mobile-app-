  FRONTEND_API_WEB_URL: ${FRONTEND_API_WEB_URL:?FRONTEND_API_WEB_URL is required}
  FRONTEND_API_ADMIN_URL: ${FRONTEND_API_ADMIN_URL:?FRONTEND_API_ADMIN_URL is required}
