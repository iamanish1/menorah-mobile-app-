  LIVEKIT_UPSTREAM: ${LIVEKIT_UPSTREAM:-}
  LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
  LIVEKIT_API_URL: ${LIVEKIT_API_URL:?LIVEKIT_API_URL is required}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  CALLING_REGION_MODE: ${CALLING_REGION_MODE:-hybrid}
  LIVEKIT_BLOCKED_COUNTRIES: ${LIVEKIT_BLOCKED_COUNTRIES:-AE}
  CALL_JOIN_EARLY_MINUTES: ${CALL_JOIN_EARLY_MINUTES:-15}
  CALL_JOIN_LATE_GRACE_MINUTES: ${CALL_JOIN_LATE_GRACE_MINUTES:-15}
  VIDEO_MEET_TICKET_TTL_SECONDS: ${VIDEO_MEET_TICKET_TTL_SECONDS:-120}
  BLOCKED_COUNTRY_CALL_PROVIDER: ${BLOCKED_COUNTRY_CALL_PROVIDER:-zoom}
  BLOCK_LIVEKIT_FOR_UAE: ${BLOCK_LIVEKIT_FOR_UAE:-true}
  BLOCK_LIVEKIT_FOR_UNKNOWN_REGION: ${BLOCK_LIVEKIT_FOR_UNKNOWN_REGION:-false}
  UAE_CALL_PROVIDER: ${UAE_CALL_PROVIDER:-zoom}
  UAE_CALLING_ENABLED: ${UAE_CALLING_ENABLED:-true}
  VSEE_ENABLED: ${VSEE_ENABLED:-true}
  VSEE_INTEGRATION_MODE: ${VSEE_INTEGRATION_MODE:-external_link}
  DOXY_ENABLED: ${DOXY_ENABLED:-false}
  ZOOM_ENABLED: ${ZOOM_ENABLED:-true}
  GOOGLE_MEET_ENABLED: ${GOOGLE_MEET_ENABLED:-false}
  TEAMS_ENABLED: ${TEAMS_ENABLED:-false}
  MONGODB_URI: ${MONGODB_URI:-}
  MONGODB_REPLICA_SET_NAME: ${MONGODB_REPLICA_SET_NAME:-menorah-rs}
  MONGODB_READ_PREFERENCE: ${MONGODB_READ_PREFERENCE:-primaryPreferred}
  MONGODB_RETRY_WRITES: ${MONGODB_RETRY_WRITES:-true}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  SERVER_USAGE_LABEL: ${SERVER_USAGE_LABEL:-On-prem server}
  SERVER_USAGE_PATH: ${SERVER_USAGE_PATH:-}
  JWT_SECRET: ${JWT_SECRET:-}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
  ADMIN_JWT_EXPIRES_IN: ${ADMIN_JWT_EXPIRES_IN:-30m}
  # Express trusts only Caddy's fixed address on app_net. This is deliberately
  # wired to CADDY_APP_IP rather than a free-form hop count.
  TRUST_PROXY: ${CADDY_APP_IP:?CADDY_APP_IP is required}
  GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}}
  GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-${EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID:-}}
  GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-${EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID:-}}
  APPLE_IOS_BUNDLE_ID: ${APPLE_IOS_BUNDLE_ID:-com.menorah.health.app}
  APPLE_WEB_SERVICE_ID: ${APPLE_WEB_SERVICE_ID:-}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
  WEB_SESSION_ORIGINS: ${WEB_SESSION_ORIGINS:?WEB_SESSION_ORIGINS is required}
  ENABLE_SOCKET_IO: ${ENABLE_SOCKET_IO:-true}
  ENABLE_SOCKET_ADAPTER: ${ENABLE_SOCKET_ADAPTER:-true}
  WORKER_MODE: ${WORKER_MODE:-standby}
  ENABLE_ARTICLE_SCHEDULER: ${ENABLE_ARTICLE_SCHEDULER:-false}
  ENABLE_SOCIAL_SCHEDULER: ${ENABLE_SOCIAL_SCHEDULER:-false}
  ENABLE_BACKUP_JOBS: ${ENABLE_BACKUP_JOBS:-false}
  ENABLE_EMAIL_JOBS: ${ENABLE_EMAIL_JOBS:-false}
  ENABLE_NOTIFICATION_JOBS: ${ENABLE_NOTIFICATION_JOBS:-false}
  MENORAH_BACKUP_ROOT: ${MENORAH_BACKUP_ROOT:-/opt/menorah/backups}
  BACKUP_AUTOMATION_ENABLED: ${BACKUP_AUTOMATION_ENABLED:-false}
  BACKUP_EXPECT_RAID: ${BACKUP_EXPECT_RAID:-false}
  BACKUP_RAID_DEVICE: ${BACKUP_RAID_DEVICE:-/dev/md/menorah-backups}
  BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-24}
  BACKUP_RESTORE_TEST_MAX_AGE_HOURS: ${BACKUP_RESTORE_TEST_MAX_AGE_HOURS:-24}
  BACKUP_DISK_USAGE_MAX_PERCENT: ${BACKUP_DISK_USAGE_MAX_PERCENT:-80}
  BACKUP_COLD_STORAGE_LABEL: ${BACKUP_COLD_STORAGE_LABEL:-2 TB cold storage HDD}
  SIX_HOURLY_RETENTION_DAYS: ${SIX_HOURLY_RETENTION_DAYS:-7}
  DAILY_RETENTION_DAYS: ${DAILY_RETENTION_DAYS:-30}
  WEEKLY_RETENTION_DAYS: ${WEEKLY_RETENTION_DAYS:-84}
  MONTHLY_RETENTION_DAYS: ${MONTHLY_RETENTION_DAYS:-366}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET_PREVIOUS: ${RAZORPAY_WEBHOOK_SECRET_PREVIOUS:-}
  RAZORPAY_X_KEY_ID: ${RAZORPAY_X_KEY_ID:-}
  RAZORPAY_X_KEY_SECRET: ${RAZORPAY_X_KEY_SECRET:-}
  RAZORPAY_PAYOUT_ACCOUNT_NUMBER: ${RAZORPAY_PAYOUT_ACCOUNT_NUMBER:-}
  RAZORPAY_X_WEBHOOK_SECRET: ${RAZORPAY_X_WEBHOOK_SECRET:-}
  BOOKING_PAYMENTS_ENABLED: ${BOOKING_PAYMENTS_ENABLED:-false}
  PAYOUTS_ENABLED: ${PAYOUTS_ENABLED:-false}
  PAYMENT_WEBHOOK_MAX_PROCESSING_ATTEMPTS: ${PAYMENT_WEBHOOK_MAX_PROCESSING_ATTEMPTS:-}
  SUBSCRIPTION_PAYMENTS_ENABLED: "false"
  BOOKING_SERVICE_CATALOG_JSON: ${BOOKING_SERVICE_CATALOG_JSON:-}
  CHECKOUT_RETURN_URL: ${CHECKOUT_RETURN_URL:?CHECKOUT_RETURN_URL is required}
  RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
  EMAIL_FROM: "${EMAIL_FROM:?EMAIL_FROM is required}"
  CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:?CONTACT_TO_EMAIL is required}
  PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:?PASSWORD_RESET_BASE_URL is required}
  LUXAND_API_TOKEN: ${LUXAND_API_TOKEN:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-local}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?MEDIA_PUBLIC_BASE_URL is required}
  UPLOAD_PATH: /app/uploads
  BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:-}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
  AUDIT_LOG_SIGNING_KEY: ${AUDIT_LOG_SIGNING_KEY:-}
  SECURITY_AUDIT_PENDING_MAX: ${SECURITY_AUDIT_PENDING_MAX:-1024}
  MAX_PAYOUT_AMOUNT_PAISE: ${MAX_PAYOUT_AMOUNT_PAISE:-}
  KYC_CONSENT_VERSION: ${KYC_CONSENT_VERSION:-}
  KYC_RETENTION_DAYS: ${KYC_RETENTION_DAYS:-}
  PRIVACY_NOTICE_VERSION: ${PRIVACY_NOTICE_VERSION:-}
  ADMIN_ROLE_GRANTS_JSON: ${ADMIN_ROLE_GRANTS_JSON:-}
  PRIVACY_RETENTION_EXECUTION_ENABLED: ${PRIVACY_RETENTION_EXECUTION_ENABLED:-false}
  PRIVACY_ADMIN_PERMISSION_GRANTS_JSON: ${PRIVACY_ADMIN_PERMISSION_GRANTS_JSON:-}
  PRIVACY_RETENTION_POLICY_JSON: ${PRIVACY_RETENTION_POLICY_JSON:-}
  PRIVACY_RETENTION_BATCH_SIZE: ${PRIVACY_RETENTION_BATCH_SIZE:-25}
  COUNSELLOR_ONBOARDING_CONSENT_VERSION: ${COUNSELLOR_ONBOARDING_CONSENT_VERSION:-}
  COUNSELLOR_CREDENTIAL_POLICY_VERSION: ${COUNSELLOR_CREDENTIAL_POLICY_VERSION:-}
  COUNSELLOR_ONBOARDING_NOTICE_URL: ${COUNSELLOR_ONBOARDING_NOTICE_URL:-}

x-api-security: &api-security
  read_only: true
  # Shared media is immutable once written. The runtime UID receives only the
  # host operator's media group so it can traverse/read files copied during the
  # existing-host transition without making them world-readable.
  group_add:
    - ${MENORAH_MEDIA_GROUP_ID:?MENORAH_MEDIA_GROUP_ID is required}
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: 1g
  cpus: "1.00"
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777

services:
  reverse-proxy:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: unless-stopped
    environment:
      PUBLIC_EMAIL: ${PUBLIC_EMAIL:-}
      LIVEKIT_UPSTREAM: ${LIVEKIT_UPSTREAM:-}
      ROOT_DOMAIN: ${ROOT_DOMAIN:?ROOT_DOMAIN is required}
      WWW_DOMAIN: ${WWW_DOMAIN:?WWW_DOMAIN is required}
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      COUNSELLOR_DOMAIN: ${COUNSELLOR_DOMAIN:?COUNSELLOR_DOMAIN is required}
      API_IOS_DOMAIN: ${API_IOS_DOMAIN:?API_IOS_DOMAIN is required}
      API_ANDROID_DOMAIN: ${API_ANDROID_DOMAIN:?API_ANDROID_DOMAIN is required}
      API_WEB_DOMAIN: ${API_WEB_DOMAIN:?API_WEB_DOMAIN is required}
      API_ADMIN_DOMAIN: ${API_ADMIN_DOMAIN:?API_ADMIN_DOMAIN is required}
      CALLS_DOMAIN: ${CALLS_DOMAIN:?CALLS_DOMAIN is required}
      CLOUDFLARED_TUNNEL_IP: ${CLOUDFLARED_TUNNEL_IP:?CLOUDFLARED_TUNNEL_IP is required}
    ports:
      - "${CADDY_HTTP_PORT:-127.0.0.1:8080}:80"
    volumes:
      - ./caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/caddy/data:/data
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/caddy/config:/config
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/logs/caddy:/var/log/caddy
    networks:
      tunnel_ingress_net:
        ipv4_address: ${CADDY_TUNNEL_IP:?CADDY_TUNNEL_IP is required}
      app_net:
        ipv4_address: ${CADDY_APP_IP:?CADDY_APP_IP is required}
      monitoring_net:
      mentle_internal:
    depends_on:
      - landing-page
      - user-web-app
      - web-app
      - admin-panel
      - livekit
      - api-ios
      - api-android
      - api-web
      - api-admin

  # Validation-only service: it deliberately has no network endpoint or
  # persistent data mounts, so repeated preflight checks cannot contend with
  # the running reverse-proxy's fixed application/tunnel addresses.
  caddy-config-validator:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    profiles: ["validation"]
    restart: "no"
    network_mode: none
    environment:
      PUBLIC_EMAIL: ${PUBLIC_EMAIL:-}
      LIVEKIT_UPSTREAM: ${LIVEKIT_UPSTREAM:-}
      ROOT_DOMAIN: ${ROOT_DOMAIN:?ROOT_DOMAIN is required}
      WWW_DOMAIN: ${WWW_DOMAIN:?WWW_DOMAIN is required}
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      COUNSELLOR_DOMAIN: ${COUNSELLOR_DOMAIN:?COUNSELLOR_DOMAIN is required}
      API_IOS_DOMAIN: ${API_IOS_DOMAIN:?API_IOS_DOMAIN is required}
      API_ANDROID_DOMAIN: ${API_ANDROID_DOMAIN:?API_ANDROID_DOMAIN is required}
      API_WEB_DOMAIN: ${API_WEB_DOMAIN:?API_WEB_DOMAIN is required}
      API_ADMIN_DOMAIN: ${API_ADMIN_DOMAIN:?API_ADMIN_DOMAIN is required}
      CALLS_DOMAIN: ${CALLS_DOMAIN:?CALLS_DOMAIN is required}
      CLOUDFLARED_TUNNEL_IP: ${CLOUDFLARED_TUNNEL_IP:?CLOUDFLARED_TUNNEL_IP is required}
    command: ["caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # The official Caddy binary carries cap_net_bind_service. Retaining this
      # single bounding capability permits exec; network_mode:none means the
      # validation-only process still has no network endpoint.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,size=8m,mode=1777
      - /data:rw,noexec,nosuid,nodev,size=8m,mode=1777
      - /var/log/caddy:rw,noexec,nosuid,nodev,size=8m,mode=1777
    volumes:
      - ./caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro

  livekit:
    image: livekit/livekit-server:v1.13.3@sha256:483b8b7b5b0654f91f1e8bdc7b46fcd37fd9911612ecf627f97e3185a89825bd
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      NODE_IP: ${LIVEKIT_NODE_IP:-}
    volumes:
      - ${LIVEKIT_CONFIG_FILE:-./livekit/livekit.yaml}:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881/tcp"
      - "${LIVEKIT_RTC_UDP_PORT_RANGE:-50000-50100}:50000-50100/udp"
    networks:
      - app_net

  landing-page:
    build:
      context: ../user-web-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${FRONTEND_API_WEB_URL:?FRONTEND_API_WEB_URL is required}"
        NEXT_PUBLIC_SOCKET_URL: "${FRONTEND_SOCKET_WEB_URL:?FRONTEND_SOCKET_WEB_URL is required}"
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-${RAZORPAY_KEY_ID:-}}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_WEB_CLIENT_ID:-}}
        NEXT_PUBLIC_JITSI_DOMAIN: ${CALLS_DOMAIN:?CALLS_DOMAIN is required}
        NEXT_PUBLIC_CALLS_URL: "${LIVEKIT_URL:?LIVEKIT_URL is required}"
        NEXT_PUBLIC_WEB_BASE_URL: "https://${WWW_DOMAIN:?WWW_DOMAIN is required}"
        NEXT_PUBLIC_SITE_URL: "https://${WWW_DOMAIN:?WWW_DOMAIN is required}"
        PUBLIC_WEB_BASE_URL: "https://${WWW_DOMAIN:?WWW_DOMAIN is required}"
        MENORAH_API_BASE_URL: "${FRONTEND_API_WEB_URL:?FRONTEND_API_WEB_URL is required}"
    restart: unless-stopped
    environment:
      PORT: "3002"
      NODE_ENV: production
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      MENORAH_STAGING_EMAIL_DOMAIN: ${MENORAH_STAGING_EMAIL_DOMAIN:-}
      MONGODB_URI: ${MONGODB_URI:-}
      MONGO_DATABASE: ${MONGO_DATABASE:-menorah}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      EMAIL_FROM: "${EMAIL_FROM:?EMAIL_FROM is required}"
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:?CONTACT_TO_EMAIL is required}
      NEXT_PUBLIC_API_URL: "${FRONTEND_API_WEB_URL:?FRONTEND_API_WEB_URL is required}"
      NEXT_PUBLIC_SOCKET_URL: "${FRONTEND_SOCKET_WEB_URL:?FRONTEND_SOCKET_WEB_URL is required}"
      NEXT_PUBLIC_JITSI_DOMAIN: ${CALLS_DOMAIN:?CALLS_DOMAIN is required}
      NEXT_PUBLIC_CALLS_URL: "${LIVEKIT_URL:?LIVEKIT_URL is required}"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_WEB_CLIENT_ID:-}}
    ports:
      - "${LANDING_LOCAL_PORT:-127.0.0.1:18085}:3002"
    networks:
      - local_probe_net
      - app_net
      - db_net
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully

  user-web-app:
    build:
      context: ../user-web-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${FRONTEND_API_WEB_URL:?FRONTEND_API_WEB_URL is required}"
        NEXT_PUBLIC_SOCKET_URL: "${FRONTEND_SOCKET_WEB_URL:?FRONTEND_SOCKET_WEB_URL is required}"
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-${RAZORPAY_KEY_ID:-}}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_WEB_CLIENT_ID:-}}
        NEXT_PUBLIC_JITSI_DOMAIN: ${CALLS_DOMAIN:?CALLS_DOMAIN is required}
        NEXT_PUBLIC_CALLS_URL: "${LIVEKIT_URL:?LIVEKIT_URL is required}"
        NEXT_PUBLIC_WEB_BASE_URL: "https://${APP_DOMAIN:?APP_DOMAIN is required}"
        NEXT_PUBLIC_SITE_URL: "https://${APP_DOMAIN:?APP_DOMAIN is required}"
        PUBLIC_WEB_BASE_URL: "https://${APP_DOMAIN:?APP_DOMAIN is required}"
        MENORAH_API_BASE_URL: "${FRONTEND_API_WEB_URL:?FRONTEND_API_WEB_URL is required}"
    restart: unless-stopped
    environment:
      PORT: "3002"
      NODE_ENV: production
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      MENORAH_STAGING_EMAIL_DOMAIN: ${MENORAH_STAGING_EMAIL_DOMAIN:-}
      MONGODB_URI: ${MONGODB_URI:-}
      MONGO_DATABASE: ${MONGO_DATABASE:-menorah}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      EMAIL_FROM: "${EMAIL_FROM:?EMAIL_FROM is required}"
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:?CONTACT_TO_EMAIL is required}
      NEXT_PUBLIC_API_URL: "${FRONTEND_API_WEB_URL:?FRONTEND_API_WEB_URL is required}"
      NEXT_PUBLIC_SOCKET_URL: "${FRONTEND_SOCKET_WEB_URL:?FRONTEND_SOCKET_WEB_URL is required}"
      NEXT_PUBLIC_JITSI_DOMAIN: ${CALLS_DOMAIN:?CALLS_DOMAIN is required}
      NEXT_PUBLIC_CALLS_URL: "${LIVEKIT_URL:?LIVEKIT_URL is required}"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_WEB_CLIENT_ID:-}}
    ports:
      - "${USER_WEB_APP_LOCAL_PORT:-127.0.0.1:18087}:3002"
    networks:
      - local_probe_net
      - app_net
      - db_net
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully

  web-app:
    build:
      context: ../web-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${FRONTEND_API_WEB_URL:?FRONTEND_API_WEB_URL is required}"
        NEXT_PUBLIC_SOCKET_URL: "${FRONTEND_SOCKET_WEB_URL:?FRONTEND_SOCKET_WEB_URL is required}"
        NEXT_PUBLIC_JITSI_DOMAIN: ${CALLS_DOMAIN:?CALLS_DOMAIN is required}
        NEXT_PUBLIC_CALLS_URL: "${LIVEKIT_URL:?LIVEKIT_URL is required}"
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "${FRONTEND_API_WEB_URL:?FRONTEND_API_WEB_URL is required}"
      NEXT_PUBLIC_SOCKET_URL: "${FRONTEND_SOCKET_WEB_URL:?FRONTEND_SOCKET_WEB_URL is required}"
      NEXT_PUBLIC_JITSI_DOMAIN: ${CALLS_DOMAIN:?CALLS_DOMAIN is required}
      NEXT_PUBLIC_CALLS_URL: "${LIVEKIT_URL:?LIVEKIT_URL is required}"
    ports:
      - "${WEB_APP_LOCAL_PORT:-127.0.0.1:18086}:3001"
    networks:
      - local_probe_net
      - app_net

  admin-panel:
    build:
      context: ../admin-panel
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${FRONTEND_API_ADMIN_URL:?FRONTEND_API_ADMIN_URL is required}"
    restart: unless-stopped
    environment:
      PORT: "3003"
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "${FRONTEND_API_ADMIN_URL:?FRONTEND_API_ADMIN_URL is required}"
    ports:
      - "${ADMIN_PANEL_LOCAL_PORT:-127.0.0.1:18088}:3003"
    networks:
      - local_probe_net
      - app_net

  api-ios:
    <<: *api-security
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "src/services/api-ios/server.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: api-ios
      APPLE_SIGN_IN_ENABLED: ${APPLE_SIGN_IN_ENABLED:?APPLE_SIGN_IN_ENABLED is required}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      MONGODB_BACKUP_URI: ""
      MONGODB_RESTORE_TEST_URI: ""
      BACKUP_ENCRYPTION_PASSWORD: ""
    ports:
      - "${API_IOS_LOCAL_PORT:-127.0.0.1:18080}:8080"
    volumes:
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/uploads:/app/uploads
    networks:
      - local_probe_net
      - app_net
      - db_net
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  api-android:
