    volumes:
      - ${MENORAH_DATA_ROOT:-/opt/menorah/data}/uploads:/app/uploads
      - ${MENORAH_BACKUP_ROOT:-/opt/menorah/backups}:${MENORAH_BACKUP_ROOT:-/opt/menorah/backups}:ro
    networks:
      - local_probe_net
      - app_net
      - db_net
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
