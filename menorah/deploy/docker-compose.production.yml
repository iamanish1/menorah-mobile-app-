  NODE_ENV: ${NODE_ENV:-production}
  DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
  MENORAH_STAGING_ALLOWED_HOSTS: ${MENORAH_STAGING_ALLOWED_HOSTS:-}
  MENORAH_STAGING_EMAIL_DOMAIN: ${MENORAH_STAGING_EMAIL_DOMAIN:-}
  SERVICE_RUNTIME: ${SERVICE_RUNTIME:-home}
  PORT: "8080"
  PUBLIC_EMAIL: ${PUBLIC_EMAIL:-}
  ROOT_DOMAIN: ${ROOT_DOMAIN:?ROOT_DOMAIN is required}
  WWW_DOMAIN: ${WWW_DOMAIN:?WWW_DOMAIN is required}
  APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
  ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
  COUNSELLOR_DOMAIN: ${COUNSELLOR_DOMAIN:?COUNSELLOR_DOMAIN is required}
  API_IOS_DOMAIN: ${API_IOS_DOMAIN:?API_IOS_DOMAIN is required}
  API_ANDROID_DOMAIN: ${API_ANDROID_DOMAIN:?API_ANDROID_DOMAIN is required}
  API_WEB_DOMAIN: ${API_WEB_DOMAIN:?API_WEB_DOMAIN is required}
  API_ADMIN_DOMAIN: ${API_ADMIN_DOMAIN:?API_ADMIN_DOMAIN is required}
