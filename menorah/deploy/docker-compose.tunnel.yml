services:
  cloudflared:
    image: cloudflare/cloudflared:2026.5.2@sha256:12ff5c6992a9863db4da270746af7c244bcaee49353039af8104268a18d6c4f0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks:
      public_net:
      tunnel_ingress_net:
        ipv4_address: ${CLOUDFLARED_TUNNEL_IP:?CLOUDFLARED_TUNNEL_IP is required}
    depends_on:
      - reverse-proxy

secrets:
  cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-/opt/menorah/secrets/cloudflare-tunnel-token}
