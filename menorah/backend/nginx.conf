# ── Menorah Health — nginx config for VPS ───────────────────────────────────
#
# This VPS serves TWO hostnames:
#
#   api.menorah.me     — public name (Cloudflare proxied, orange cloud ON)
#                        End-users never hit this directly; Cloudflare Worker
#                        terminates the TLS and then connects here.
#
#   vps.menorah.me     — internal name (Cloudflare proxy OFF, gray cloud)
#                        Used ONLY by the Cloudflare Worker for:
#                          • Direct health checks (cron, every minute)
#                          • Socket.IO traffic (pinned to VPS)
#                          • LiveKit webhook (pinned to VPS)
#                        This bypasses the Worker so the health check
#                        doesn't loop back into itself.
#
# SSL covers both names — certbot command:
#   certbot --nginx \
#     -d api.menorah.me \
#     -d vps.menorah.me
#
# Installation:
#   sudo cp nginx.conf /etc/nginx/sites-available/menorah
#   sudo ln -s /etc/nginx/sites-available/menorah /etc/nginx/sites-enabled/menorah
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# ── Upstream — PM2 cluster on localhost ──────────────────────────────────────
upstream menorah_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect (both domains) ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.menorah.me vps.menorah.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — serves both api. and vps. on the same Node.js backend ─────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.menorah.me vps.menorah.me;

    # certbot fills these in after:
    #   certbot --nginx -d api.menorah.me -d vps.menorah.me
    ssl_certificate     /etc/letsencrypt/live/api.menorah.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.menorah.me/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Timeouts ──────────────────────────────────────────────────────────────
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    keepalive_timeout   75s;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options   nosniff        always;
    add_header X-Frame-Options          DENY           always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types application/json application/javascript text/plain text/css;
    gzip_min_length 1000;
    gzip_vary on;

    # ── File uploads ──────────────────────────────────────────────────────────
    client_max_body_size 25M;

    # ── Health check — no auth, no rate limit, no access log ─────────────────
    # Cloudflare Worker cron hits vps.menorah.me/health every minute.
    location = /health {
        proxy_pass         http://menorah_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── Socket.IO — WebSocket upgrade + long-polling ──────────────────────────
    # Cloudflare Worker pins /socket.io/ to VPS permanently.
    location /socket.io/ {
        proxy_pass         http://menorah_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
    }

    # ── All other API traffic ──────────────────────────────────────────────────
    location / {
        proxy_pass         http://menorah_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
    }
}
