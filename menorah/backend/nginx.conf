# ── Menorah Health — nginx config for VPS ───────────────────────────────────
#
# Installation:
#   sudo cp nginx.conf /etc/nginx/sites-available/menorah
#   sudo ln -s /etc/nginx/sites-available/menorah /etc/nginx/sites-enabled/menorah
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (Let's Encrypt):
#   sudo certbot --nginx -d api.menorahhealth.app
#   (certbot auto-inserts the ssl_certificate / ssl_certificate_key lines)

# ── Upstream — PM2 cluster on localhost ──────────────────────────────────────
upstream menorah_api {
    # PM2 cluster mode binds all workers to the same port.
    # Nginx keeps one pool of keepalive connections to reduce overhead.
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.menorahhealth.app;

    # Let's Encrypt ACME challenge (certbot uses this path)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.menorahhealth.app;

    # SSL — certbot fills these in automatically after: certbot --nginx -d api.menorahhealth.app
    ssl_certificate     /etc/letsencrypt/live/api.menorahhealth.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.menorahhealth.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Timeouts ──────────────────────────────────────────────────────────────
    # WebSocket connections (Socket.IO) stay open for the duration of a session.
    # Bump these high enough to avoid nginx killing live chat/video sessions.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    keepalive_timeout   75s;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options   nosniff        always;
    add_header X-Frame-Options          DENY           always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types application/json application/javascript text/plain text/css;
    gzip_min_length 1000;
    gzip_vary on;

    # ── Client body size (file uploads via Cloudinary) ────────────────────────
    client_max_body_size 15M;

    # ── Socket.IO — requires WebSocket upgrade + long-polling support ─────────
    location /socket.io/ {
        proxy_pass         http://menorah_api;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Real client IP forwarding (used by Express rate limiter)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time events
        proxy_buffering off;
    }

    # ── Health check — no auth, no rate limit (used by Cloudflare Worker cron) ─
    location = /health {
        proxy_pass         http://menorah_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── All other API traffic ──────────────────────────────────────────────────
    location / {
        proxy_pass         http://menorah_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent nginx from buffering API responses (important for streaming)
        proxy_buffering    off;
        proxy_cache        off;
    }
}
