# Production Cloud Build deployment is intentionally disabled.
#
# This fail-closed tombstone remains at the former trigger path. It is
# intentionally not a Cloud Build configuration, so an overlooked trigger
# fails configuration validation before starting a build, publishing an image,
# or receiving a step that could mutate Cloud Run. The sole production release
# method is the operator-invoked guarded Compose flow in
# menorah/deploy/ubuntu/update-from-git.sh.
#
# Retired feature state (documentation only):
#   BOOKING_PAYMENTS_ENABLED=false
#   PAYOUTS_ENABLED=false
# Retired dedicated payout declarations remain in:
#   legacy/cloudbuild.cloudrun.yaml.disabled

disabledProductionDeployment:
  platform: cloud-build
  disabled: true
  authoritativeMethod: menorah/deploy/ubuntu/update-from-git.sh
