# Menorah Health - GCP Cloud Build CI/CD
#
# Config file path:
#   menorah/backend/cloudbuild.yaml
#
# This build produces:
#   - one backend image deployed to four audience-specific API services
#   - one user web image deployed to landing and webapp services
#   - one admin image deployed to the admin panel service
#
# Required trigger substitutions:
#   _PROJECT_ID
#   _REGION
#   _REPO
#   _NEXT_PUBLIC_API_URL
#   _NEXT_PUBLIC_SOCKET_URL
#   _NEXT_PUBLIC_RAZORPAY_KEY_ID
#   _NEXT_PUBLIC_JITSI_DOMAIN
#
# Optional trigger substitutions:
#   _NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
#   _NEXT_PUBLIC_WEB_BASE_URL
#   _PUBLIC_WEB_BASE_URL
#   _CONTACT_TO_EMAIL
#   _MONGO_DATABASE
#   _SMTP_PORT
#   _SMTP_SECURE
#
# Store backend and frontend server secrets in Secret Manager before deploying.
# Real production values must be exported outside git first; see:
#   menorah/docs/current-production-setup.md

substitutions:
  _PROJECT_ID: your-gcp-project-id
  _REGION: asia-south1
  _REPO: menorah
  _NEXT_PUBLIC_API_URL: https://api.menorah.me/api
  _NEXT_PUBLIC_SOCKET_URL: https://api.menorah.me
  _NEXT_PUBLIC_RAZORPAY_KEY_ID: REPLACE_WITH_RAZORPAY_PUBLIC_KEY
  _NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: REPLACE_WITH_STRIPE_PUBLIC_KEY_OR_EMPTY
  _NEXT_PUBLIC_JITSI_DOMAIN: meet.jit.si
  _NEXT_PUBLIC_WEB_BASE_URL: https://www.menorah.me
  _PUBLIC_WEB_BASE_URL: https://www.menorah.me
  _CONTACT_TO_EMAIL: menorahenquiries@gmail.com
  _MONGO_DATABASE: menorah
  _SMTP_PORT: "587"
  _SMTP_SECURE: "false"

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-api:$COMMIT_SHA
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-api:latest
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-api:latest
      - --file=menorah/backend/Dockerfile
      - menorah/backend
    waitFor: ['-']

  - name: gcr.io/cloud-builders/docker
    id: push-backend
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-api
    waitFor: [build-backend]

  - name: gcr.io/cloud-builders/docker
    id: build-user-web
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-landing:$COMMIT_SHA
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-landing:latest
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-webapp:$COMMIT_SHA
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-webapp:latest
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-landing:latest
      - --build-arg=NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
      - --build-arg=NEXT_PUBLIC_SOCKET_URL=${_NEXT_PUBLIC_SOCKET_URL}
      - --build-arg=NEXT_PUBLIC_RAZORPAY_KEY_ID=${_NEXT_PUBLIC_RAZORPAY_KEY_ID}
      - --build-arg=NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - --build-arg=NEXT_PUBLIC_JITSI_DOMAIN=${_NEXT_PUBLIC_JITSI_DOMAIN}
      - --build-arg=NEXT_PUBLIC_WEB_BASE_URL=${_NEXT_PUBLIC_WEB_BASE_URL}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_PUBLIC_WEB_BASE_URL}
      - --build-arg=PUBLIC_WEB_BASE_URL=${_PUBLIC_WEB_BASE_URL}
      - --build-arg=MENORAH_API_BASE_URL=${_NEXT_PUBLIC_API_URL}
      - --file=menorah/user-web-app/Dockerfile
      - menorah/user-web-app
    waitFor: ['-']

  - name: gcr.io/cloud-builders/docker
    id: push-landing
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-landing
    waitFor: [build-user-web]

  - name: gcr.io/cloud-builders/docker
    id: push-webapp
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-webapp
    waitFor: [build-user-web]

  - name: gcr.io/cloud-builders/docker
    id: build-admin-panel
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-admin-panel:$COMMIT_SHA
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-admin-panel:latest
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-admin-panel:latest
      - --build-arg=NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
      - --file=menorah/admin-panel/Dockerfile
      - menorah/admin-panel
    waitFor: ['-']

  - name: gcr.io/cloud-builders/docker
    id: push-admin-panel
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-admin-panel
    waitFor: [build-admin-panel]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-api-services
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        BACKEND_SECRETS="MONGODB_URI=MONGODB_URI:latest,JWT_SECRET=JWT_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,ALLOWED_ORIGINS=ALLOWED_ORIGINS:latest,REDIS_URL=REDIS_URL:latest,MSG91_AUTH_KEY=MSG91_AUTH_KEY:latest,MSG91_OTP_TEMPLATE_ID=MSG91_OTP_TEMPLATE_ID:latest,MSG91_SMS_TEMPLATE_ID=MSG91_SMS_TEMPLATE_ID:latest,MSG91_EMAIL_DOMAIN=MSG91_EMAIL_DOMAIN:latest,MSG91_EMAIL_TEMPLATE_ID=MSG91_EMAIL_TEMPLATE_ID:latest,MSG91_EMAIL_OTP_TEMPLATE_ID=MSG91_EMAIL_OTP_TEMPLATE_ID:latest,EMAIL_FROM=EMAIL_FROM:latest,RAZORPAY_KEY_ID=RAZORPAY_KEY_ID:latest,RAZORPAY_KEY_SECRET=RAZORPAY_KEY_SECRET:latest,RAZORPAY_WEBHOOK_SECRET=RAZORPAY_WEBHOOK_SECRET:latest,RAZORPAY_X_KEY_ID=RAZORPAY_X_KEY_ID:latest,RAZORPAY_X_KEY_SECRET=RAZORPAY_X_KEY_SECRET:latest,RAZORPAY_PAYOUT_ACCOUNT_NUMBER=RAZORPAY_PAYOUT_ACCOUNT_NUMBER:latest,RAZORPAY_X_WEBHOOK_SECRET=RAZORPAY_X_WEBHOOK_SECRET:latest,CHECKOUT_RETURN_URL=CHECKOUT_RETURN_URL:latest,LIVEKIT_URL=LIVEKIT_URL:latest,LIVEKIT_API_URL=LIVEKIT_API_URL:latest,LIVEKIT_API_KEY=LIVEKIT_API_KEY:latest,LIVEKIT_API_SECRET=LIVEKIT_API_SECRET:latest,CLOUDINARY_CLOUD_NAME=CLOUDINARY_CLOUD_NAME:latest,CLOUDINARY_API_KEY=CLOUDINARY_API_KEY:latest,CLOUDINARY_API_SECRET=CLOUDINARY_API_SECRET:latest,LUXAND_API_TOKEN=LUXAND_API_TOKEN:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,SOCIAL_TOKEN_ENCRYPTION_KEY=SOCIAL_TOKEN_ENCRYPTION_KEY:latest"
        BACKEND_ENV="NODE_ENV=production,SERVER_TZ=Asia/Kolkata,BCRYPT_ROUNDS=12,MAX_FILE_SIZE=5242880,MOBILE_APP_SCHEME=menorah-health://reset-password,ENABLE_SOCKET_ADAPTER=false,UPLOAD_PATH=./uploads,LUXAND_DETECT_URL=https://api.luxand.cloud/photo/detect,LUXAND_FACE_CONFIDENCE_THRESHOLD=90,EKYC_MAX_FILE_SIZE=15728640,SOCIAL_STUDIO_ENABLED=true,SOCIAL_STUDIO_STORAGE=cloudinary,CLOUDINARY_ARTICLE_FOLDER=menorah/articles,CLOUDINARY_SOCIAL_STUDIO_FOLDER=menorah/social-studio,CLOUDINARY_SOCIAL_STUDIO_ASSET_FOLDER=menorah/social-studio-assets"

        for service in menorah-api-ios menorah-api-android menorah-api-web menorah-api-admin; do
          gcloud run deploy "$$service" \
            --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-api:$COMMIT_SHA \
            --region=${_REGION} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=60 \
            --concurrency=80 \
            --set-secrets="$$BACKEND_SECRETS" \
            --set-env-vars="$$BACKEND_ENV"
        done
    waitFor: [push-backend]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-landing
    entrypoint: gcloud
    args:
      - run
      - deploy
      - menorah-landing
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-landing:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=0
      - --max-instances=5
      - --memory=512Mi
      - --cpu=1
      - --timeout=60
      - --concurrency=80
      - --set-secrets=MONGODB_URI=MONGODB_URI:latest,SMTP_HOST=SMTP_HOST:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASS=SMTP_PASS:latest,SMTP_FROM_EMAIL=SMTP_FROM_EMAIL:latest
      - --set-env-vars=NODE_ENV=production,NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL},NEXT_PUBLIC_SOCKET_URL=${_NEXT_PUBLIC_SOCKET_URL},NEXT_PUBLIC_RAZORPAY_KEY_ID=${_NEXT_PUBLIC_RAZORPAY_KEY_ID},NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY},NEXT_PUBLIC_JITSI_DOMAIN=${_NEXT_PUBLIC_JITSI_DOMAIN},NEXT_PUBLIC_WEB_BASE_URL=${_NEXT_PUBLIC_WEB_BASE_URL},NEXT_PUBLIC_SITE_URL=${_PUBLIC_WEB_BASE_URL},PUBLIC_WEB_BASE_URL=${_PUBLIC_WEB_BASE_URL},MENORAH_API_BASE_URL=${_NEXT_PUBLIC_API_URL},MONGO_DATABASE=${_MONGO_DATABASE},CONTACT_TO_EMAIL=${_CONTACT_TO_EMAIL},SMTP_PORT=${_SMTP_PORT},SMTP_SECURE=${_SMTP_SECURE}
    waitFor: [push-landing]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-webapp
    entrypoint: gcloud
    args:
      - run
      - deploy
      - menorah-webapp
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-webapp:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=0
      - --max-instances=10
      - --memory=512Mi
      - --cpu=1
      - --timeout=60
      - --concurrency=80
      - --set-secrets=MONGODB_URI=MONGODB_URI:latest,SMTP_HOST=SMTP_HOST:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASS=SMTP_PASS:latest,SMTP_FROM_EMAIL=SMTP_FROM_EMAIL:latest
      - --set-env-vars=NODE_ENV=production,NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL},NEXT_PUBLIC_SOCKET_URL=${_NEXT_PUBLIC_SOCKET_URL},NEXT_PUBLIC_RAZORPAY_KEY_ID=${_NEXT_PUBLIC_RAZORPAY_KEY_ID},NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY},NEXT_PUBLIC_JITSI_DOMAIN=${_NEXT_PUBLIC_JITSI_DOMAIN},NEXT_PUBLIC_WEB_BASE_URL=${_NEXT_PUBLIC_WEB_BASE_URL},NEXT_PUBLIC_SITE_URL=${_PUBLIC_WEB_BASE_URL},PUBLIC_WEB_BASE_URL=${_PUBLIC_WEB_BASE_URL},MENORAH_API_BASE_URL=${_NEXT_PUBLIC_API_URL},MONGO_DATABASE=${_MONGO_DATABASE},CONTACT_TO_EMAIL=${_CONTACT_TO_EMAIL},SMTP_PORT=${_SMTP_PORT},SMTP_SECURE=${_SMTP_SECURE}
    waitFor: [push-webapp]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-admin-panel
    entrypoint: gcloud
    args:
      - run
      - deploy
      - menorah-admin-panel
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-admin-panel:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=0
      - --max-instances=5
      - --memory=512Mi
      - --cpu=1
      - --timeout=60
      - --concurrency=80
      - --set-env-vars=NODE_ENV=production,NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
    waitFor: [push-admin-panel]

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-api:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-api:latest
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-landing:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-landing:latest
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-webapp:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-webapp:latest
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-admin-panel:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/menorah-admin-panel:latest

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
